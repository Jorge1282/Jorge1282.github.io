  html += '<button class="group-header group-header-btn" onclick="toggleGroup(\'' + gastosCatKey + '\',-1)">';
  html += '  <span class="group-title-wrap"><span class="group-chevron ' + (gastosCatExpanded?'open':'') + '">' + ICONS.chevronDown + '</span><span class="group-title">Gastos Mes</span></span>';
  html += '  <span class="group-net" style="color:var(--gold);font-weight:700">' + breakdown.length + ' Categoría' + (breakdown.length===1?'':'s') + '</span>';
  html += '</button>';
  if (!gastosCatExpanded){
    return html;
  }
  if (breakdown.length === 0){
    html += '<div class="empty-note">Aún no registras egresos este mes.</div>';
  } else {
    var breakdownUSD = getCategoryBreakdownUSD(monthTx);
    var maxUsd = Math.max.apply(null, breakdownUSD.map(function(r){ return r.usdTotal; }).concat([1]));
    var todayRate = getRateForDate(todayStr());
    html += '<div class="ledger-list">';
    breakdownUSD.forEach(function(row){
      var budget = state.budgets[row.category] || {};
      var budgetUSD = budget.usd || 0;
      if (!budgetUSD && budget.ves > 0 && todayRate) budgetUSD = budget.ves / todayRate;
      html += '<div class="cat-row">';
      html += '  <div class="cat-row-top"><span class="cat-label">' + esc(catLabel(row.category)) + '</span></div>';
      html += renderCatUSDLine(row.usdTotal, maxUsd, budgetUSD, row.unconverted);
      html += '</div>';
    });
    html += '</div>';
  }
  return html;
}

function renderMovimientos(monthTx){
  var html = '<div class="segmented" style="margin-bottom:16px">';
  html += '  <button class="segment-btn ' + (state.movGroupBy==='semana'?'active-gold':'') + '" onclick="setMovGroupBy(\'semana\')">Por Semana</button>';
  html += '  <button class="segment-btn ' + (state.movGroupBy==='categoria'?'active-gold':'') + '" onclick="setMovGroupBy(\'categoria\')">Por Categoría</button>';
  html += '</div>';

  if (monthTx.length === 0){
    html += '<div class="empty-note">No hay movimientos registrados este mes. Toca "Agregar" para anotar el primero.</div>';
    return html;
  }

  var groups = state.movGroupBy === 'semana' ? groupTxByWeek(monthTx) : groupTxByCategory(monthTx);

  groups.forEach(function(g, gi){
    var title = state.movGroupBy === 'semana'
      ? ('Semana ' + formatDayMonthShort(g.start) + ' – ' + formatDayMonthShort(g.end))
      : g.label;
    var expanded = isGroupExpanded(g.key, gi);
    var groupNetUSD = 0, groupUnconverted = false;
    g.txs.forEach(function(t){
      var r = txAmountUSD(t);
      if (!r.converted) groupUnconverted = true; else groupNetUSD += r.value;
    });
    html += '<button class="group-header group-header-btn" onclick="toggleGroup(\'' + g.key + '\',' + gi + ')">';
    html += '  <span class="group-title-wrap"><span class="group-chevron ' + (expanded?'open':'') + '">' + ICONS.chevronDown + '</span><span class="group-title">' + esc(title) + '</span></span>';
    html += '  <span class="group-net"><span style="color:' + (groupNetUSD>=0?'var(--teal)':'var(--coral)') + '">' + (groupNetUSD>=0?'+':'') + fmt(groupNetUSD,'USD') + '</span>' + (groupUnconverted?' <span style="color:var(--text-faint)">(hay montos sin tasa)</span>':'') + '</span>';
    html += '</button>';

    if (!expanded){ return; }

    html += '<div class="ledger-list" style="margin-bottom:20px">';
    var lastDate = null;
    g.txs.forEach(function(t){
      if (state.movGroupBy === 'semana' && t.date !== lastDate){
        lastDate = t.date;
        var dd = new Date(t.date + 'T00:00:00');
        html += '<div class="day-divider">' + esc(DAYS_ES[dd.getDay()]) + ' ' + formatDayMonthShort(t.date) + '</div>';
      }
      var isIncome = t.type === 'ingreso';
      var txResult = txAmountUSD(t);
      var txAmountDisplay = txResult.converted
        ? fmt(Math.abs(txResult.value), 'USD')
        : fmt(t.amount, t.currency) + ' <span style="color:var(--text-faint);font-size:10px">(sin tasa de ese día)</span>';
      html += '<div class="tx-row">';
      html += '  <span class="tx-dot" style="background:' + (isIncome?'var(--teal)':'var(--coral)') + '"></span>';
      html += '  <div style="flex:1;min-width:0">';
      html += '    <div class="tx-label">' + esc(catLabel(t.category)) + '</div>';
      html += '    <div class="tx-date">' + esc(t.date) + (t.note ? ' · ' + esc(t.note) : '') + (t.currency==='VES' && txResult.converted ? (' · Bs. ' + Number(t.amount).toLocaleString('es-VE',{minimumFractionDigits:2,maximumFractionDigits:2})) : '') + '</div>';
      html += '  </div>';
      html += '  <div class="tx-amount" style="color:' + (isIncome?'var(--teal)':'var(--coral)') + '">' + (isIncome?'+ ':'\u2212 ') + txAmountDisplay + '</div>';
      html += '  <button class="trash-btn" onclick="editTransaction(\'' + t.id + '\')" title="Editar">' + ICONS.edit + '</button>';
      html += '  <button class="trash-btn" onclick="deleteTransaction(\'' + t.id + '\')" title="Eliminar">' + ICONS.trash + '</button>';
      html += '</div>';
    });
    html += '</div>';
  });

  return html;
}

function renderDayRow(r){
  var netUSDColor = r.netUSD > 0 ? 'var(--teal)' : (r.netUSD < 0 ? 'var(--coral)' : 'var(--text-faint)');
  var netVESColor = r.netVES > 0 ? 'var(--teal)' : (r.netVES < 0 ? 'var(--coral)' : 'var(--text-faint)');

  html += '  <div class="day-num">' + pad2(r.day) + '</div>';

    html += '    <div class="day-net" style="color:' + netUSDColor + '">' + (r.netUSD>=0?'+':'') + fmt(r.netUSD,'USD') + '</div>';
    html += '    <div class="day-net" style="color:' + netVESColor + '">' + (r.netVES>=0?'+':'') + fmt(r.netVES,'VES') + '</div>';

function renderGoalRing(pct, colorOverride){
  var raw = pct;
  var clamped = Math.max(0, Math.min(100, pct));
  var r = 38, circ = 2 * Math.PI * r;
  var offset = circ - (clamped / 100) * circ;
  var color = colorOverride || (raw >= 100 ? 'var(--teal)' : (raw >= 60 ? 'var(--gold)' : 'var(--coral)'));
  var svg = '<svg width="92" height="92" viewBox="0 0 92 92" style="flex-shrink:0">';
  svg += '<circle cx="46" cy="46" r="' + r + '" fill="none" stroke="var(--surface-2)" stroke-width="9"/>';
  svg += '<circle cx="46" cy="46" r="' + r + '" fill="none" stroke="' + color + '" stroke-width="9" stroke-linecap="round" stroke-dasharray="' + circ + '" stroke-dashoffset="' + offset + '" transform="rotate(-90 46 46)"/>';
  svg += '<text x="46" y="52" text-anchor="middle" font-family="var(--font-mono)" font-size="18" font-weight="700" fill="' + color + '">' + Math.round(raw) + '%</text>';
  svg += '</svg>';
  return svg;
}

function renderGoalRingCard(label, saved, startAmt, goalIncrement, currency){
  var totalTarget = round2(saved + goalIncrement);
  var pct = goalIncrement > 0 && totalTarget > 0 ? Math.round((saved / totalTarget) * 100) : 0;
  var isNegative = saved < 0;
  var amountColor = isNegative ? 'var(--coral)' : 'var(--text)';
  var html = '<div class="goal-ring-card">';
  html += '  ' + (goalIncrement > 0 ? renderGoalRing(pct) : renderGoalRing(0, 'var(--text-faint)'));
  html += '  <div class="goal-ring-body">';
  html += '    <div class="goal-ring-label">' + esc(label) + '</div>';
  html += '    <div class="goal-ring-numbers" style="color:' + amountColor + '">' + (isNegative ? '− ' : '+ ') + fmt(saved, currency) + '</div>';
  if (goalIncrement > 0){
    html += '    <div class="goal-ring-of">Progreso: ' + fmt(saved, currency) + ' de ' + fmt(totalTarget, currency) + ' (Meta Total)</div>';
  } else {
    html += '    <div class="goal-ring-of">Sin meta definida</div>';
  }
  html += '  </div>';
  html += '</div>';
  return html;
}

function renderGoalCard(label, saved, goalAmt, currency){
  var pct = goalAmt > 0 ? Math.min(100, Math.max(0, Math.round((saved/goalAmt)*100))) : 0;
  var html = '<div class="goal-card">';
  html += '  <div class="goal-row"><span>' + esc(label) + '</span><span class="goal-pct">' + pct + '%</span></div>';
  html += '  <div class="bar-track"><div class="bar-fill-gold" style="width:' + pct + '%"></div></div>';
  html += '  <div class="goal-numbers">' + fmt(saved,currency) + ' de ' + fmt(goalAmt,currency) + '</div>';
  html += '</div>';
  return html;
}

function saveAhorroCompleto(period){
  var currentUsd = document.getElementById('ahorroCurrentUsd_' + period).value;
  var goalUsd = document.getElementById('ahorroGoalUsd_' + period).value;

  state.currentSavings[period] = { usd: Number(currentUsd)||0 };
  state.goal[period] = { usd: Number(goalUsd)||0 };

  recordSavingsHistoryEntry(period, state.currentSavings[period].usd);
  saveSavingsToStorage();
  saveData();
  render();
  pushToCloud();
}

  var g = state.goal.monthly;

  var totalsUSD = getMonthTotalsUSD(monthTx);

  var expenseCombinedUSD = totalsUSD.expenseUSD;    // total egresos en USD

  var ahorroAlInicio = getSavingsAtDate('monthly', monthStartStr);
  var openingAvailableUSD = opening.usd - ahorroAlInicio.usd;
  var openingAvailableVES = opening.ves;
  var openingRate = getRateForDate(monthStartStr);

  ingresoPresupuestoHtml += renderBudgetVsIncomeCard();
  ingresoPresupuestoHtml += '<div class="section-label" style="margin-top:22px">Presupuesto del Mes vs. Ingreso Total (Disponible + Ingresos)</div>';

  ingresoPresupuestoHtml += '<div class="section-label" style="margin-top:22px">Presupuesto del Mes vs. Gastos del Mes</div>';
  ingresoPresupuestoHtml += renderBudgetVsExpensesCard(expenseCombinedUSD);

function renderBudgetVsRealIncomeCard(totals, totalIncomeCombined, incomeCombined, openingAvailableCombined){
  var sumUsd = 0, sumVes = 0;
  Object.keys(state.budgets).forEach(function(id){
    var b = state.budgets[id];
    if (!b) return;
    sumUsd += Number(b.usd) || 0;
    sumVes += Number(b.ves) || 0;
  });
  if (sumUsd === 0 && sumVes === 0){
    return '<div class="empty-note" style="padding-top:0">Todavía no definiste presupuestos por categoría (Ajustes → Presupuesto por Categoría).</div>';
  }

  // Si no se pasan los valores, los calculamos (por compatibilidad)
  var incomeTotal = totalIncomeCombined;
  var incomeComb = incomeCombined;
  var openingComb = openingAvailableCombined;
  if (typeof incomeTotal !== 'number' || incomeTotal === undefined) {
    var opening = getMonthOpeningBalance();
    var vdForOpening3 = getViewDate();
    var monthStartStr3 = vdForOpening3.getFullYear() + '-' + pad2(vdForOpening3.getMonth()+1) + '-01';
    var ahorroAlInicio3 = getSavingsAtDate('monthly', monthStartStr3);
    var openingAvailableUSD3 = opening.usd - ahorroAlInicio3.usd;
    var openingAvailableVES3 = opening.ves - ahorroAlInicio3.ves;
    var openingRate3 = getRateForDate(monthStartStr3);
    openingComb = openingAvailableUSD3 + (openingRate3 ? openingAvailableVES3 / openingRate3 : 0);
    var monthTx = getMonthTx();
    var totalsUSD = getMonthTotalsUSD(monthTx);
    incomeComb = totalsUSD.incomeUSD;
    incomeTotal = openingComb + incomeComb;
  }

  if (incomeTotal <= 0){
    return '<div class="empty-note" style="padding-top:0">Todavía no cargaste ingresos este mes ni tenés disponible previo — en cuanto haya algo, vas a ver acá qué porcentaje está comprometido en presupuesto.</div>';
  }

  var html = '';
  if (sumUsd > 0 && incomeTotal > 0){
    var pctU = Math.round((sumUsd / incomeTotal) * 100);
    var colorU = pctU > 100 ? 'var(--coral)' : 'var(--teal)';
    html += '<div class="goal-card">';
    html += '  <div class="goal-row"><span>Presupuesto vs Ingreso Total</span><span class="goal-pct" style="color:' + colorU + '">' + pctU + '%</span></div>';
    html += '  <div class="bar-track"><div class="bar-fill-gold" style="width:' + Math.min(100,pctU) + '%;background:' + colorU + '"></div></div>';
    html += '  <div class="goal-numbers">' + fmt(sumUsd,'USD') + ' presupuestado de ' + fmt(incomeTotal,'USD') + ' disponible + cobrado' + (pctU>100?' · Ya comprometiste más de lo que tenías':'') + '</div>';
    // Desglose: Disponible al Inicio + Ingreso Real (ya convertidos)
    html += '  <div class="budget-note" style="margin-top:8px;padding-top:8px;border-top:1px dashed var(--line)">Desglose: ' + fmt(openingComb,'USD') + ' Disponible al Inicio + ' + fmt(incomeComb,'USD') + ' Ingreso Real = ' + fmt(incomeTotal,'USD') + '</div>';
    html += '</div>';
  }
  if (!html){
    html = '<div class="empty-note" style="padding-top:0">Tenés presupuesto definido en una moneda distinta a la que tenés disponible este mes — no hay una comparación directa disponible todavía.</div>';
  }
  return html;
}

// Nueva función: Presupuesto vs Gastos del Mes (reemplaza a la de pagos comprometidos)
function renderBudgetVsExpensesCard(expenseCombinedUSD){
  var sumUsd = 0;
  Object.keys(state.budgets).forEach(function(id){
    var b = state.budgets[id];
    if (!b) return;
    sumUsd += Number(b.usd) || 0;
    if (b.ves > 0){
      var todayRate = getRateForDate(todayStr());
      if (todayRate) sumUsd += b.ves / todayRate;
    }
  });
  if (sumUsd === 0){
    return '<div class="empty-note" style="padding-top:0">Todavía no definiste presupuestos por categoría.</div>';
  }
  if (expenseCombinedUSD === 0){
    return '<div class="empty-note" style="padding-top:0">No hay egresos registrados este mes.</div>';
  }
  var pct = Math.round((expenseCombinedUSD / sumUsd) * 100);
  var color = pct > 100 ? 'var(--coral)' : (pct > 80 ? '#E0A94E' : 'var(--teal)');
  var html = '<div class="goal-card">';
  html += '  <div class="goal-row"><span>Gastos del Mes</span><span class="goal-pct" style="color:' + color + '">' + pct + '%</span></div>';
  html += '  <div class="bar-track"><div class="bar-fill-gold" style="width:' + Math.min(100,pct) + '%;background:' + color + '"></div></div>';
  html += '  <div class="goal-numbers">' + fmt(expenseCombinedUSD,'USD') + ' en gastos de ' + fmt(sumUsd,'USD') + ' presupuestados' + (pct>100?' · Has superado tu presupuesto':'') + '</div>';
  html += '  <div class="budget-note" style="margin-top:6px">Los gastos en Bs. se convierten a $ con la tasa vigente en la fecha de cada gasto.</div>';
  html += '</div>';
  return html;
}

function renderBudgetVsIncomeCard(){
  var goal = state.familyIncomeGoal;
  var sumUsd = 0, sumVes = 0;
  Object.keys(state.budgets).forEach(function(id){
    var b = state.budgets[id];

    sumUsd += Number(b.usd) || 0;

  var html = '';

    html += '<div class="goal-card">';
    html += '  <div class="goal-row"><span>Presupuesto vs Ingreso (USD)</span><span class="goal-pct" style="color:' + colorU + '">' + pctU + '%</span></div>';
    html += '  <div class="bar-track"><div class="bar-fill-gold" style="width:' + Math.min(100,pctU) + '%;background:' + colorU + '"></div></div>';
    html += '  <div class="goal-numbers">' + fmt(sumUsd,'USD') + ' presupuestado de ' + fmt(goal.usd,'USD') + ' de ingreso esperado' + (pctU>100?' · Excede tu ingreso planeado':'') + '</div>';
    html += '</div>';
  }
  if (goal.ves > 0){
    var pctV = Math.round((sumVes / goal.ves) * 100);
    var colorV = pctV > 100 ? 'var(--coral)' : 'var(--teal)';
    html += '<div class="goal-card" style="margin-top:8px">';
    html += '  <div class="goal-row"><span>Presupuesto vs Ingreso (Bs.)</span><span class="goal-pct" style="color:' + colorV + '">' + pctV + '%</span></div>';
    html += '  <div class="bar-track"><div class="bar-fill-gold" style="width:' + Math.min(100,pctV) + '%;background:' + colorV + '"></div></div>';
    html += '  <div class="goal-numbers">' + fmt(sumVes,'VES') + ' presupuestado de ' + fmt(goal.ves,'VES') + ' de ingreso esperado' + (pctV>100?' · Excede tu ingreso planeado':'') + '</div>';
    html += '</div>';
  }
  return html;
}

function renderMetasSemanal(monthTx){
  var g = state.goal.weekly;
  var s = state.currentSavings.weekly;
  var st = state.savingsStart.weekly;
  var weeks = groupTxByWeek(monthTx);
  var todayMonday = mondayOf(todayStr());
  var currentWeek = weeks.find(function(w){ return w.start === todayMonday; });
  var currentWeekLabel = currentWeek ? (formatDayMonthShort(currentWeek.start) + '–' + formatDayMonthShort(currentWeek.end)) : (formatDayMonthShort(todayMonday) + '–' + formatDayMonthShort(addDaysStr(todayMonday,6)));
  var otherWeeks = weeks.filter(function(w){ return w.start !== todayMonday; });

  var html = '<div class="section-label">Esta semana (' + currentWeekLabel + ')</div>';
  html += renderGoalRingCard('Ahorro Actual (USD)', s.usd, st.usd, g.usd, 'USD');
  html += renderAhorroForm('weekly');

  html += '<div class="section-label" style="margin-top:22px">Semanas anteriores (ingresos − egresos)</div>';
  if (otherWeeks.length === 0){
    html += '<div class="empty-note" style="padding-top:0">No hay más semanas registradas este mes.</div>';
  } else {
    otherWeeks.forEach(function(w){
      var label = 'Semana ' + formatDayMonthShort(w.start) + ' – ' + formatDayMonthShort(w.end);
      var cumplioUSD = g.usd > 0 ? w.netUSD >= g.usd : null;
      var cumplioVES = g.ves > 0 ? w.netVES >= g.ves : null;
      html += '<div class="goal-card">';
      html += '  <div class="goal-row"><span>' + esc(label) + '</span></div>';
      if (g.usd > 0){
        var pu = Math.min(100, Math.max(0, Math.round((w.netUSD/g.usd)*100)));
        html += '  <div class="bar-track"><div class="bar-fill-gold" style="width:' + pu + '%"></div></div>';
        html += '  <div class="goal-numbers">' + fmt(w.netUSD,'USD') + ' de ' + fmt(g.usd,'USD') + (cumplioUSD!==null ? (cumplioUSD?' · Cumplió':' · No cumplió') : '') + '</div>';
      }
      if (g.ves > 0){
        var pv = Math.min(100, Math.max(0, Math.round((w.netVES/g.ves)*100)));
        html += '  <div class="bar-track" style="margin-top:6px"><div class="bar-fill-gold" style="width:' + pv + '%"></div></div>';
        html += '  <div class="goal-numbers">' + fmt(w.netVES,'VES') + ' de ' + fmt(g.ves,'VES') + (cumplioVES!==null ? (cumplioVES?' · Cumplió':' · No cumplió') : '') + '</div>';
      }
      if (g.usd === 0 && g.ves === 0){
        html += '  <div class="goal-numbers">Neto: ' + fmt(w.netUSD,'USD') + ' / ' + fmt(w.netVES,'VES') + '</div>';
      }
      html += '</div>';
    });
  }
  return html;
}

function renderMetasDiario(){
  var g = state.goal.daily;
  var rows = getDailyBalances();
  var weeks = groupDayRowsByWeek(rows, 'metasdia-').slice().reverse();

  var html = '<div class="section-label">Ahorro por día</div>';
  if (g.usd === 0 && g.ves === 0){
    html += '<div class="empty-note">Define una meta diaria abajo para ver qué días cumpliste.</div>';
  }

  weeks.forEach(function(w, wi){
    var label = 'Semana ' + formatDayMonthShort(w.start) + ' – ' + formatDayMonthShort(w.end);
    var expanded = isGroupExpanded(w.key, wi);
    html += '<button class="group-header group-header-btn" onclick="toggleGroup(\'' + w.key + '\',' + wi + ')">';
    html += '  <span class="group-title-wrap"><span class="group-chevron ' + (expanded?'open':'') + '">' + ICONS.chevronDown + '</span><span class="group-title">' + esc(label) + '</span></span>';
    html += '  <span class="group-net">';
    if (w.netUSD !== 0) html += '<span style="color:' + (w.netUSD>=0?'var(--teal)':'var(--coral)') + '">' + (w.netUSD>=0?'+':'') + fmt(w.netUSD,'USD') + '</span> ';
    if (w.netVES !== 0) html += '<span style="color:' + (w.netVES>=0?'var(--teal)':'var(--coral)') + '">' + (w.netVES>=0?'+':'') + fmt(w.netVES,'VES') + '</span>';
    html += '</span></button>';

    if (!expanded) return;

    html += '<div class="ledger-list" style="margin-bottom:20px">';
    w.rows.slice().reverse().forEach(function(r){
      var cumplioUSD = g.usd > 0 ? r.netUSD >= g.usd : null;
      var cumplioVES = g.ves > 0 ? r.netVES >= g.ves : null;
      var cumplio = (cumplioUSD===null && cumplioVES===null) ? null : ((cumplioUSD!==false) && (cumplioVES!==false));
      html += '<div class="day-row">';
      html += '  <div class="day-num">' + pad2(r.day) + '</div>';
      html += '  <div class="day-mid">';
      html += '    <div class="day-net" style="color:' + (r.netUSD>=0?'var(--teal)':'var(--coral)') + '">' + (r.netUSD>=0?'+':'') + fmt(r.netUSD,'USD') + '</div>';
      html += '    <div class="day-net" style="color:' + (r.netVES>=0?'var(--teal)':'var(--coral)') + '">' + (r.netVES>=0?'+':'') + fmt(r.netVES,'VES') + '</div>';
      html += '  </div>';
      if (cumplio !== null){
        html += '  <div style="color:' + (cumplio?'var(--teal)':'var(--coral)') + ';font-size:11px;font-family:var(--font-mono);font-weight:700">' + (cumplio?'Cumplió':'No cumplió') + '</div>';
      }
      html += '</div>';
    });
    html += '</div>';
  });

  html += '<div class="section-label" style="margin-top:20px">Ajustar meta diaria</div>';
  html += '<div class="empty-note" style="padding-top:0">Cuánto quieres ahorrar (neto) cada día.</div>';
  html += '<div class="form-group"><label class="form-label">Meta diaria en USD</label><input class="input" type="number" inputmode="decimal" id="goalDayUsdInput" value="' + g.usd + '"></div>';
  html += '<div class="form-group"><label class="form-label">Meta diaria en Bs.</label><input class="input" type="number" inputmode="decimal" id="goalDayVesInput" value="' + g.ves + '"></div>';
  html += '<button class="primary-btn" onclick="saveGoal(\'daily\', document.getElementById(\'goalDayUsdInput\').value, document.getElementById(\'goalDayVesInput\').value)">Guardar meta diaria</button>';
  return html;
}

function renderPresupuesto(){
  var html = '<div class="section-label" style="margin-top:26px">Presupuesto por Categoria</div>';
  html += '<div class="empty-note" style="padding-top:0">Define un límite mensual por categoría, en Bs. o en $. Si lo pones en $, la app muestra el equivalente en Bs. a la tasa de hoy — el % de cumplimiento siempre se calcula en la moneda original, no se mezcla.</div>';

  var totalUSD = 0, totalVES = 0;
  EXPENSE_CATEGORIES.forEach(function(c){
    var b = state.budgets[c.id] || { usd: 0, ves: 0 };
    totalUSD += Number(b.usd) || 0;
    totalVES += Number(b.ves) || 0;
  });
  if (totalUSD > 0 || totalVES > 0){
    html += '<div class="goal-card" style="margin-bottom:18px">';
    html += '  <div class="goal-row"><span>Total de Presupuesto</span></div>';
    html += '  <div class="goal-numbers" style="font-size:14px;font-weight:700;color:var(--gold)">' + (totalUSD>0?fmt(totalUSD,'USD'):'') + (totalUSD>0&&totalVES>0?' + ':'') + (totalVES>0?fmt(totalVES,'VES'):'') + '</div>';
    html += '</div>';
  }

  EXPENSE_CATEGORIES.forEach(function(c){
    var b = state.budgets[c.id] || { usd: 0, ves: 0 };
    html += '<div class="form-group"><label class="form-label">' + esc(c.label) + '</label>';
    html += '  <div class="form-row">';
    html += '    <input class="input" type="number" inputmode="decimal" placeholder="Bs." id="budgetVes_' + c.id + '" value="' + (b.ves || '') + '" style="flex:1">';
    html += '    <input class="input" type="number" inputmode="decimal" placeholder="$" id="budgetUsd_' + c.id + '" value="' + (b.usd || '') + '" style="width:90px">';
    html += '  </div>';
    if (b.usd > 0 || b.ves > 0){
      var notes = [];
      if (b.usd > 0) notes.push('$' + b.usd + budgetEquivalentInline(b.usd, 'USD'));
      if (b.ves > 0) notes.push('Bs.' + b.ves + budgetEquivalentInline(b.ves, 'VES'));
      html += '  <div class="budget-note">' + notes.join(' · ') + '</div>';
    }
    html += '</div>';
  });
  html += '<button class="primary-btn" onclick="saveBudgets()">Guardar presupuestos</button>';
  return html;
}

function renderPagos(){
  var html = '<div class="section-label">Compromisos de pago</div>';
  html += '<div class="empty-note" style="padding-top:0">Agrega las fechas de pago de cada categoría (pueden ser varias, ej. cuotas de Cashea). En Resumen aparecerá un aviso cuando se acerquen o venzan.</div>';
  html += renderNotificationBanner();

  var grandUSD = 0, grandVES = 0;
  var byMonth = {}; // key -> {usd, ves}
  var byPerson = {}; // id -> {usd, ves}
  var byMonthPerson = {}; // monthKey -> personId -> {usd, ves}
  getPaymentCategories().forEach(function(catId){
    (state.paymentCommitments[catId] || []).forEach(function(p){
      var amt = Number(p.amount) || 0;
      if (p.currency === 'USD') grandUSD += amt; else grandVES += amt;

      if (p.date){
        var mk = monthKeyFromDate(p.date);
        if (!byMonth[mk]) byMonth[mk] = { usd: 0, ves: 0 };
        if (p.currency === 'USD') byMonth[mk].usd += amt; else byMonth[mk].ves += amt;

        if (p.person){
          if (!byMonthPerson[mk]) byMonthPerson[mk] = {};
          if (!byMonthPerson[mk][p.person]) byMonthPerson[mk][p.person] = { usd: 0, ves: 0 };
          if (p.currency === 'USD') byMonthPerson[mk][p.person].usd += amt; else byMonthPerson[mk][p.person].ves += amt;
        }
      }
      if (p.person){
        if (!byPerson[p.person]) byPerson[p.person] = { usd: 0, ves: 0 };
        if (p.currency === 'USD') byPerson[p.person].usd += amt; else byPerson[p.person].ves += amt;
      }
    });
  });

  if (grandUSD > 0 || grandVES > 0){
    var monthKeys = Object.keys(byMonth).sort();
    if (monthKeys.length){
      html += '<div class="section-label" style="margin-top:0">Por mes</div>';
      monthKeys.forEach(function(mk){
        var m = byMonth[mk];
        html += '<div class="goal-card" style="margin-bottom:8px">';
        html += '  <div class="goal-row"><span>Total de Pago ' + esc(monthLabelFromKey(mk)) + '</span></div>';
        html += '  <div class="goal-numbers" style="font-size:13px;font-weight:700;color:var(--gold)">' + (m.usd>0?fmt(m.usd,'USD'):'') + (m.usd>0&&m.ves>0?' + ':'') + (m.ves>0?fmt(m.ves,'VES'):'') + '</div>';
        var mp = byMonthPerson[mk];
        if (mp){
          PAYMENT_PERSONS.forEach(function(per){
            var pm = mp[per.id];
            if (!pm || (pm.usd<=0 && pm.ves<=0)) return;
            html += '  <div class="budget-note" style="margin-top:4px"><span style="color:' + per.color + ';font-weight:600">' + esc(per.label) + '</span>: ' + (pm.usd>0?fmt(pm.usd,'USD'):'') + (pm.usd>0&&pm.ves>0?' + ':'') + (pm.ves>0?fmt(pm.ves,'VES'):'') + '</div>';
          });
        }
        html += '</div>';
      });
    }

    html += '<div class="goal-card" style="margin-bottom:12px">';
    html += '  <div class="goal-row"><span>Total de Pagos</span></div>';
    html += '  <div class="goal-numbers" style="font-size:14px;font-weight:700;color:var(--gold)">' + (grandUSD>0?fmt(grandUSD,'USD'):'') + (grandUSD>0&&grandVES>0?' + ':'') + (grandVES>0?fmt(grandVES,'VES'):'') + '</div>';
    html += '</div>';

    var personIds = PAYMENT_PERSONS.map(function(p){ return p.id; }).filter(function(id){ return byPerson[id]; });
    if (personIds.length){
      html += '<div class="section-label" style="margin-top:4px">Por persona</div>';
      personIds.forEach(function(id){
        var m = byPerson[id];
        var perDef = PAYMENT_PERSONS.find(function(p){ return p.id === id; });
        html += '<div class="goal-card" style="margin-bottom:8px;border-left:3px solid ' + perDef.color + '">';
        html += '  <div class="goal-row"><span style="color:' + perDef.color + ';font-weight:700">Total de Pago ' + esc(personLabel(id)) + '</span></div>';
        html += '  <div class="goal-numbers" style="font-size:13px;font-weight:700;color:var(--gold)">' + (m.usd>0?fmt(m.usd,'USD'):'') + (m.usd>0&&m.ves>0?' + ':'') + (m.ves>0?fmt(m.ves,'VES'):'') + '</div>';
        html += '</div>';
      });
      html += '<div style="height:6px"></div>';
    }
  }

  var sortedCategories = getPaymentCategories().slice().sort(function(a, b){
    return catLabel(a).localeCompare(catLabel(b));
  });
  var withCommitments = sortedCategories.filter(function(id){ return (state.paymentCommitments[id] || []).length > 0; });
  var withoutCommitments = sortedCategories.filter(function(id){ return (state.paymentCommitments[id] || []).length === 0; });

  withCommitments.forEach(function(catId, ri){
    html += renderPaymentCategoryBlock(catId, ri === 0 ? 0 : -1);
  });

  if (withoutCommitments.length > 0){
    var otrasKey = 'pagos-otras-categorias';
    var otrasExpanded = isGroupExpanded(otrasKey, -1);
    html += '<button class="group-header group-header-btn" onclick="toggleGroup(\'' + otrasKey + '\',-1)">';
    html += '  <span class="group-title-wrap"><span class="group-chevron ' + (otrasExpanded?'open':'') + '">' + ICONS.chevronDown + '</span><span class="group-title">Otras categorías (sin fechas aún)</span></span>';
    html += '  <span class="group-net-badge">' + withoutCommitments.length + '</span>';
    html += '</button>';
    if (otrasExpanded){
      withoutCommitments.forEach(function(catId, ri){
        html += renderPaymentCategoryBlock(catId, -1);
      });
    }
  }

  return html;
}

function renderPaymentCategoryBlock(catId, defaultExpandIndex){
  var html = '';
  var label = catLabel(catId);
  var key = 'pagoscat-' + catId;
  var expanded = isGroupExpanded(key, defaultExpandIndex);
  var list = (state.paymentCommitments[catId] || []).slice().sort(function(a,b){ return a.date < b.date ? -1 : 1; });
  var subUSDTotal = 0, hasUnconverted = false;
  list.forEach(function(p){
    var amt = Number(p.amount) || 0;
    if (!amt) return;
    if (p.currency === 'USD'){ subUSDTotal += amt; }
    else {
      var r = getRateForDate(p.date);
      if (r) subUSDTotal += amt / r; else hasUnconverted = true;
    }
  });

  html += '<button class="group-header group-header-btn" onclick="toggleGroup(\'' + key + '\',' + defaultExpandIndex + ')">';
  html += '  <span class="group-title-wrap"><span class="group-chevron ' + (expanded?'open':'') + '">' + ICONS.chevronDown + '</span><span class="group-title">' + esc(label) + '</span></span>';
  if (subUSDTotal > 0){
    html += '  <span class="group-net-badge">' + fmt(subUSDTotal,'USD') + (hasUnconverted ? ' +' : '') + '</span>';
  } else {
    html += '  <span class="group-net-badge">' + list.length + ' fecha' + (list.length===1?'':'s') + '</span>';
  }
  html += '</button>';

  if (expanded){
    var editing = state.editingPayment && state.editingPayment.catId === catId ? state.editingPayment : null;
    var editItem = null;
    if (editing) editItem = (state.paymentCommitments[catId]||[]).find(function(p){ return p.id === editing.id; });

    if (list.length){
      html += '<div class="ledger-list" style="margin-bottom:12px">';
      list.forEach(function(p){
        var isEditing = editing && editing.id === p.id;
        var amountDisplay = '';
        if (p.amount){
          if (p.currency === 'USD'){
            amountDisplay = fmt(p.amount, 'USD');
          } else {
            var pRate = getRateForDate(p.date);
            if (pRate){
              amountDisplay = fmt(p.amount / pRate, 'USD') + ' <span style="color:var(--text-faint)">(' + fmt(p.amount,'VES') + ' a Bs. ' + pRate.toLocaleString('es-VE',{minimumFractionDigits:2,maximumFractionDigits:2}) + ')</span>';
            } else {
              amountDisplay = fmt(p.amount, 'VES') + ' <span style="color:var(--text-faint)">(sin tasa de ese día para convertir a $)</span>';
            }
          }
        }
        html += '<div class="tx-row" style="' + (isEditing ? 'border:1px solid var(--gold)' : '') + '">';
        html += '  <span class="tx-dot" style="background:' + (p.paid?'var(--teal)':'var(--coral)') + '"></span>';
        html += '  <div style="flex:1;min-width:0"><div class="tx-label">' + esc(formatDayMonthShort(p.date)) + (p.person ? (' · <span style="color:' + (PAYMENT_PERSONS.find(function(x){return x.id===p.person;})||{color:'inherit'}).color + ';font-weight:600">' + esc(personLabel(p.person)) + '</span>') : '') + (p.note ? (' · ' + esc(p.note)) : '') + '</div>' + (amountDisplay ? ('<div class="tx-date">' + amountDisplay + '</div>') : '') + '</div>';
        html += '  <button class="trash-btn" style="width:auto;padding:4px 8px;font-family:var(--font-mono);font-size:10px;color:' + (p.paid?'var(--teal)':'var(--coral)') + '" onclick="togglePaymentPaid(\'' + catId + '\',\'' + p.id + '\')">' + (p.paid?'Pagado':'Pendiente') + '</button>';
        html += '  <button class="trash-btn" onclick="editPaymentDate(\'' + catId + '\',\'' + p.id + '\')" title="Editar">' + ICONS.edit + '</button>';
        html += '  <button class="trash-btn" onclick="deletePaymentDate(\'' + catId + '\',\'' + p.id + '\')" title="Eliminar">' + ICONS.trash + '</button>';
        html += '</div>';
      });
      html += '</div>';
    }

    html += '<div class="sheet-title" style="font-size:13px;margin-bottom:8px">' + (editItem ? 'Editar fecha' : 'Agregar Fecha') + '</div>';
    html += '<div class="form-group"><label class="form-label">Fecha de Pago</label><input class="input" type="date" id="payDate_' + catId + '" value="' + (editItem ? esc(editItem.date) : '') + '"></div>';
    html += '<div class="form-group"><label class="form-label">Persona (opcional)</label><select class="input" id="payPerson_' + catId + '"><option value="">Sin asignar</option>';
    PAYMENT_PERSONS.forEach(function(per){
      html += '<option value="' + per.id + '" ' + (editItem && editItem.person===per.id ? 'selected' : '') + '>' + esc(per.label) + '</option>';
    });
    html += '</select></div>';
    html += '<div class="form-group"><label class="form-label">Nota (opcional)</label><input class="input" type="text" id="payNote_' + catId + '" placeholder="Ej. Cuota 2 de 3" value="' + (editItem ? esc(editItem.note||'') : '') + '"></div>';
    html += '<div class="form-row">';
    html += '  <div class="form-group" style="flex:1"><label class="form-label">Monto (opcional)</label><input class="input" type="number" inputmode="decimal" id="payAmount_' + catId + '" value="' + (editItem && editItem.amount ? editItem.amount : '') + '"></div>';
    html += '  <div class="form-group" style="width:90px"><label class="form-label">Moneda</label><select class="input" id="payCurrency_' + catId + '"><option value="USD" ' + (!editItem||editItem.currency==='USD'?'selected':'') + '>$</option><option value="VES" ' + (editItem&&editItem.currency==='VES'?'selected':'') + '>Bs.</option></select></div>';
    html += '</div>';
    html += '<button class="primary-btn" onclick="addPaymentDate(\'' + catId + '\')">' + (editItem ? 'Guardar cambios' : 'Agregar Fecha') + '</button>';
    if (editItem) html += '<button class="primary-btn" style="background:var(--surface-2);color:var(--text-dim);border:1px solid var(--line);margin-top:8px" onclick="cancelEditPayment()">Cancelar edición</button>';
    html += '<div style="height:14px"></div>';
  }
  return html;
}

function renderAjustes(){
  if (state.ajustesScreen === 'presupuesto') return renderMetasBack('Ajustes', 'ajustes') + renderPresupuesto();

  (state.customCategories.income || []).forEach(function(c){
    var isEditingInc = state.editingCategory && state.editingCategory.type === 'ingreso' && state.editingCategory.id === c.id;

      html += '<div class="form-row" style="align-items:center;margin-bottom:8px">';

      html += '  <button class="icon-btn" onclick="cancelEditCategory()" title="Cancelar">' + ICONS.x + '</button>';

function addCustomCategoryFromAjustes(type){

function renderCoach(){
  var m = getFinancialScore();
  var insights = getCoachInsights();
  var tip = getCoachTipOfDay();

  var html = '<div class="section-label">Coach Financiero</div>';
  html += '<div class="empty-note" style="padding-top:0">Un diagnóstico de tus finanzas basado en tus propios datos, calculado en este mismo teléfono. Te ayuda a ver patrones, no reemplaza asesoría profesional para decisiones grandes.</div>';

  html += '<div class="saldo-card" style="border-color:' + m.band.color + ';background:linear-gradient(135deg, ' + m.band.color + '22, var(--surface-2));text-align:center;padding:22px 16px">';
  html += '  <div style="font-family:var(--font-mono);font-size:42px;font-weight:700;color:' + m.band.color + '">' + m.score + '</div>';
  html += '  <div style="font-size:11px;letter-spacing:1px;text-transform:uppercase;color:var(--text-faint);margin-top:2px">Salud financiera</div>';
  html += '  <div style="font-family:var(--font-display);font-size:15px;color:' + m.band.color + ';margin-top:6px">' + esc(m.band.label) + '</div>';
  html += '</div>';

  html += '<div style="display:flex;gap:8px;margin-top:10px">';
  var rateColor = m.savingsRate === null ? 'var(--text-faint)' : m.savingsRate >= 20 ? 'var(--teal)' : m.savingsRate >= 10 ? '#E0A94E' : 'var(--coral)';
  html += '  <div class="goal-card" style="flex:1;text-align:center;padding:14px 10px">';
  html += '    <div style="font-size:10px;letter-spacing:0.6px;text-transform:uppercase;color:var(--text-faint)">Tasa de Ahorro Real</div>';
  html += '    <div style="font-family:var(--font-mono);font-size:22px;font-weight:700;color:' + rateColor + ';margin-top:4px">' + (m.savingsRate === null ? '—' : Math.round(m.savingsRate) + '%') + '</div>';
  html += '    <div style="font-size:9.5px;color:var(--text-faint);margin-top:2px">del ingreso real del mes</div>';
  html += '  </div>';

  var proj = getMonthProjection();
  html += '  <div class="goal-card" style="flex:1;text-align:center;padding:14px 10px">';
  html += '    <div style="font-size:10px;letter-spacing:0.6px;text-transform:uppercase;color:var(--text-faint)">Proyección Fin de Mes</div>';
  if (proj){
    html += '    <div style="font-family:var(--font-mono);font-size:13.5px;font-weight:700;color:var(--gold);margin-top:4px">' + (proj.proyectadoUSD>0?('≈ $ '+proj.proyectadoUSD.toLocaleString('es-VE',{minimumFractionDigits:0,maximumFractionDigits:0})):'') + '</div>';
    html += '    <div style="font-family:var(--font-mono);font-size:11px;color:var(--gold);opacity:0.85">' + (proj.proyectadoVES>0?('≈ Bs. '+proj.proyectadoVES.toLocaleString('es-VE',{minimumFractionDigits:0,maximumFractionDigits:0})):'') + '</div>';
    html += '    <div style="font-size:9.5px;color:var(--text-faint);margin-top:3px">día ' + proj.diasTranscurridos + ' de ' + proj.diasTotales + '</div>';
  } else {
    html += '    <div style="font-family:var(--font-mono);font-size:14px;color:var(--text-faint);margin-top:4px">—</div>';
    html += '    <div style="font-size:9.5px;color:var(--text-faint);margin-top:2px">solo en el mes actual</div>';
  }
  html += '  </div>';
  html += '</div>';

  if (insights.length === 0){
    html += '<div class="empty-note">Todavía no hay suficientes datos este mes para armar un diagnóstico completo. Agregá movimientos y compromisos de pago para ver alertas y recomendaciones acá.</div>';
  } else {
    html += '<div class="section-label" style="margin-top:20px">Diagnóstico</div>';
    insights.forEach(function(ins){
      var color = ins.level === 'danger' ? 'var(--coral)' : ins.level === 'warning' ? '#E0A94E' : ins.level === 'success' ? 'var(--teal)' : 'var(--gold)';
      var prefix = (ins.level === 'danger' || ins.level === 'warning') ? '⚠ ' : '';
      html += '<div class="goal-card" style="border-left:3px solid ' + color + '">';
      html += '  <div class="goal-row"><span style="color:' + color + ';font-weight:700">' + prefix + esc(ins.title) + '</span></div>';
      html += '  <div class="goal-numbers" style="font-weight:400;line-height:1.5">' + esc(ins.body) + '</div>';
      html += '</div>';
    });
  }

  html += '<div class="section-label" style="margin-top:20px">Consejo del día</div>';
  html += '<div class="goal-card" style="border-left:3px solid var(--gold)">';
  html += '  <div class="goal-numbers" style="font-weight:400;line-height:1.6;font-style:italic">' + esc(tip) + '</div>';
  html += '</div>';

  html += '<div class="empty-note" style="margin-top:10px;font-size:11px">Este contenido es educativo y se genera con reglas fijas a partir de tus datos — no es asesoría financiera personalizada. Para decisiones importantes de inversión, crédito o impuestos, consultá con un profesional matriculado.</div>';

  return html;
}
