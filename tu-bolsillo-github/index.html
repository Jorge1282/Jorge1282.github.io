function normalizeGoal(g){
  if (!g) return { monthly: {usd:0,ves:0}, weekly: {usd:0,ves:0}, daily: {usd:0,ves:0} };
  if (g.monthly || g.weekly || g.daily){
    return {
      monthly: g.monthly || {usd:0,ves:0},
      weekly: g.weekly || {usd:0,ves:0},
      daily: g.daily || {usd:0,ves:0}
    };
  }
  /* meta antigua (solo mensual, sin anidar) */
  return { monthly: { usd: g.usd||0, ves: g.ves||0 }, weekly: {usd:0,ves:0}, daily: {usd:0,ves:0} };
}

function simpleHash(str){
  var hash = 5381;
  for (var i=0;i<str.length;i++){ hash = ((hash*33) ^ str.charCodeAt(i)) >>> 0; }
  return hash.toString(16);
}
function loadPin(){
  try {
    var raw = localStorage.getItem(STORAGE_KEY_PIN);
    if (raw){ state.pinHash = raw; state.locked = true; }
  } catch(e){ console.error('pin load error', e); }
}
function persistPin(){
  try { localStorage.setItem(STORAGE_KEY_PIN, state.pinHash || ''); } catch(e){}
  pushToCloud();
}
function setPinInput(v){ state.pinInput = v; state.pinError = false; render(); }
function submitPin(){
  if (state.pinInput && simpleHash(state.pinInput) === state.pinHash){
    state.locked = false; state.pinInput = ''; state.pinError = false;
    render();
  } else {
    state.pinError = true; state.pinInput = '';

  }
}
function changePin(){
  var v = document.getElementById('newPinInput').value;
  if (!/^\d{4,6}$/.test(v)){ window.alert('El PIN debe tener entre 4 y 6 números.'); return; }
  state.pinHash = simpleHash(v);

  render();

}

function getUpcomingPayments(){
  var today = todayStr();
  var list = [];
  PAYMENT_CATEGORIES.forEach(function(catId){
    (state.paymentCommitments[catId] || []).forEach(function(p){
      if (p.paid) return;
      var diffDays = Math.round((new Date(p.date + 'T00:00:00') - new Date(today + 'T00:00:00')) / 86400000);
      list.push({ catId: catId, label: catLabel(catId), date: p.date, note: p.note, amount: p.amount, currency: p.currency, diffDays: diffDays, id: p.id });
    });
  });
  list.sort(function(a,b){ return a.diffDays - b.diffDays; });
  return list;
}

/* ---------- notificaciones ---------- */
function isNotificationSupported(){
  return typeof Notification !== 'undefined' && 'serviceWorker' in navigator;
}
function getNotificationStatus(){
  if (!isNotificationSupported()) return 'unsupported';
  return Notification.permission; /* 'default' | 'granted' | 'denied' */
}
function requestNotificationPermission(){
  if (!isNotificationSupported()){
    window.alert('Tu navegador no soporta notificaciones, o necesitas instalar la app (no solo abrirla en una pestaña normal) para poder activarlas.');
    return;
  }
  Notification.requestPermission().then(function(perm){
    render();
    if (perm === 'granted'){
      checkAndNotifyPayments(true);
    } else if (perm === 'denied'){
      window.alert('Quedaron bloqueadas. Si cambias de opinión, tendrás que activarlas desde los ajustes de notificaciones de tu navegador o del sistema para este sitio/app.');
    }
  });
}
function loadNotifiedLog(){
  try { return JSON.parse(localStorage.getItem(STORAGE_KEY_NOTIFIED) || '{}'); } catch(e){ return {}; }
}
function saveNotifiedLog(log){
  try { localStorage.setItem(STORAGE_KEY_NOTIFIED, JSON.stringify(log)); } catch(e){}
}
function checkAndNotifyPayments(force){
  if (getNotificationStatus() !== 'granted') return;
  var today = todayStr();
  var log = loadNotifiedLog();
  var upcoming = getUpcomingPayments().filter(function(p){ return p.diffDays <= 3; });
  if (!upcoming.length) return;
  navigator.serviceWorker.ready.then(function(reg){
    upcoming.forEach(function(p){
      var logKey = p.id;
      if (!force && log[logKey] === today) return;
      var title = p.diffDays < 0 ? ('⚠ ' + p.label + ' venció') : p.diffDays === 0 ? (p.label + ' vence hoy') : (p.label + ' — pago próximo');
      var bodyParts = [];
      if (p.diffDays < 0) bodyParts.push('Venció hace ' + Math.abs(p.diffDays) + ' día(s)');
      else if (p.diffDays === 0) bodyParts.push('Vence hoy');
      else bodyParts.push('Vence en ' + p.diffDays + ' día(s), el ' + formatDayMonthShort(p.date));
      if (p.note) bodyParts.push(p.note);
      if (p.amount) bodyParts.push(fmt(p.amount, p.currency || 'VES'));
      reg.showNotification(title, {
        body: bodyParts.join(' · '),
        icon: 'icon-192.png',
        badge: 'icon-192.png',
        tag: 'tubolsillo-pago-' + p.id
      });
      log[logKey] = today;
    });
    saveNotifiedLog(log);
  }).catch(function(e){ console.error('notification error', e); });
}

function downloadBlob(content, filename, mime){
  var blob = new Blob([content], { type: mime });
  var url = URL.createObjectURL(blob);
  var a = document.createElement('a');
  a.href = url; a.download = filename;
  document.body.appendChild(a); a.click(); document.body.removeChild(a);
  URL.revokeObjectURL(url);
}

var EXCELJS_CDN = 'https://cdn.jsdelivr.net/npm/exceljs@4.4.0/dist/exceljs.min.js';
var exceljsLoadPromise = null;
function loadExcelJS(){
  if (window.ExcelJS) return Promise.resolve();
  if (exceljsLoadPromise) return exceljsLoadPromise;
  exceljsLoadPromise = new Promise(function(resolve, reject){
    var s = document.createElement('script');
    s.src = EXCELJS_CDN;
    s.onload = function(){ resolve(); };
    s.onerror = function(){
      exceljsLoadPromise = null;
      reject(new Error('No se pudo cargar el generador de Excel. Revisa tu conexión a internet e intenta de nuevo.'));
    };
    document.head.appendChild(s);
  });
  return exceljsLoadPromise;
}

var XLS_TEAL = 'FF1F7A6C';

var XLS_ORANGE = 'FFF2994A';
var XLS_GREY = 'FFF2F2F2';
var XLS_BORDER = 'FFE3E3E3';
var XLS_TEXT = 'FF1B1F1E';
var XLS_RED = 'FFD64545';
var XLS_NUMFMT_VES = '"ves"#,##0.00;[Red]-"ves"#,##0.00';
var XLS_NUMFMT_USD = '"$ "#,##0.00;[Red]-"$ "#,##0.00';

function xlsThinBorder(){
  var b = { style: 'thin', color: { argb: XLS_BORDER } };
  return { top: b, left: b, bottom: b, right: b };
}
function xlsAmountText(n, prefix){
  var abs = Math.abs(n).toLocaleString('es-VE', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
  return (n < 0 ? '-' : '') + prefix + abs;
}
function setXlsAmountCell(cell, ves, usd, bold){
  var hasVES = ves !== 0, hasUSD = usd !== 0;
  if (hasVES && hasUSD){
    cell.value = { richText: [
      { text: xlsAmountText(ves, 'ves'), font: { bold: !!bold, color: { argb: ves < 0 ? XLS_RED : XLS_TEXT } } },
      { text: ' / ', font: { bold: !!bold, color: { argb: XLS_TEXT } } },
      { text: xlsAmountText(usd, '$ '), font: { bold: !!bold, color: { argb: usd < 0 ? XLS_RED : XLS_TEXT } } }
    ]};
  } else if (hasVES){
    cell.value = ves;
    cell.numFmt = XLS_NUMFMT_VES;
    if (bold) cell.font = { bold: true };
  } else if (hasUSD){
    cell.value = usd;
    cell.numFmt = XLS_NUMFMT_USD;
    if (bold) cell.font = { bold: true };
  }
}

/* ---------- sincronización familiar (Firebase) ---------- */
var familyDocRef = null;
var fbReady = false;
var suppressNextPush = false;

function isFirebaseConfigured(){
  return FIREBASE_CONFIG.apiKey && FIREBASE_CONFIG.apiKey.indexOf('TU_') !== 0 &&
         FAMILY_CODE && FAMILY_CODE.indexOf('CAMBIA') !== 0;
}
function initFirebaseSync(){
  if (!isFirebaseConfigured()) return;
  if (typeof firebase === 'undefined'){
    console.error('Firebase SDK no cargó (revisa tu conexión a internet)');
    return;
  }
  try {
    state.syncStatus = 'connecting';
    firebase.initializeApp(FIREBASE_CONFIG);
    var db = firebase.firestore();
    try { db.enablePersistence({ synchronizeTabs: true }).catch(function(){}); } catch(e){}
    familyDocRef = db.collection('tu_bolsillo_app').doc(FAMILY_CODE);
    fbReady = true;
    familyDocRef.onSnapshot(function(snap){
      if (snap.exists){
        var data = snap.data() || {};
        state.transactions = data.transactions || [];
        state.goal = normalizeGoal(data.goal);
        state.initialBalance = data.initialBalance || { usd: 0, ves: 0 };
        state.budgets = data.budgets || {};
        state.paymentCommitments = data.paymentCommitments || {};
        state.currentSavings = data.currentSavings || { monthly: {usd:0,ves:0}, weekly: {usd:0,ves:0} };
        state.savingsStart = data.savingsStart || { monthly: {usd:0,ves:0}, weekly: {usd:0,ves:0} };
        if (data.pinHash){
          state.pinHash = data.pinHash;
          try { localStorage.setItem(STORAGE_KEY_PIN, data.pinHash); } catch(e){}
        }
        state.syncStatus = 'synced';
        saveData();
        try { localStorage.setItem(STORAGE_KEY_BALANCE, JSON.stringify(state.initialBalance)); } catch(e){}
        try { localStorage.setItem(STORAGE_KEY_BUDGETS, JSON.stringify(state.budgets)); } catch(e){}
        try { localStorage.setItem(STORAGE_KEY_PAYMENTS, JSON.stringify(state.paymentCommitments)); } catch(e){}
        render();
      } else {
        pushToCloud();
      }
    }, function(err){
      console.error('Firestore sync error', err);
      state.syncStatus = 'error';
      render();
    });
  } catch(e){
    console.error('Firebase init error', e);
    state.syncStatus = 'error';
    render();
  }
}
function pushToCloud(){
  if (!fbReady || !familyDocRef) return;
  familyDocRef.set({
    transactions: state.transactions,
    goal: state.goal,
    initialBalance: state.initialBalance,
    budgets: state.budgets,
    paymentCommitments: state.paymentCommitments,
    currentSavings: state.currentSavings,
    savingsStart: state.savingsStart,
    pinHash: state.pinHash || null,
    updatedAt: firebase.firestore.FieldValue.serverTimestamp()
  }).then(function(){
    state.syncStatus = 'synced';
    render();
  }).catch(function(e){
    console.error('push to cloud error', e);
    state.syncStatus = 'error';
    render();
  });
}
function fetchWithTimeout(url, ms){
  var timeoutPromise = new Promise(function(_, reject){
    setTimeout(function(){ reject(new Error('timeout')); }, ms);
  });
  return Promise.race([ fetch(url, { cache: 'no-cache' }), timeoutPromise ]);
}

function fetchBcvRate(){
  state.rateStatus = 'loading';
  render();
  tryEndpoint(0);
}
function tryEndpoint(i){
  if (i >= BCV_ENDPOINTS.length){
    state.rateStatus = 'error';
    render();
    return;
  }
  fetchWithTimeout(BCV_ENDPOINTS[i], 8000)
    .then(function(res){ if (!res.ok) throw new Error('HTTP ' + res.status); return res.json(); })
    .then(function(data){
      state.bcvRate = { usd: data.USD, date: data.effective_date || data.date, updatedAt: data.updated_at };
      state.rateStatus = 'ok';
      saveCachedRate();
      render();
    })
    .catch(function(err){
      console.error('BCV fetch error (' + BCV_ENDPOINTS[i] + ')', err);
      tryEndpoint(i + 1);
    });
}

function loadCachedHistory(){
  try {
    var raw = localStorage.getItem(STORAGE_KEY_HISTORY);

  } catch(e){ console.error('history cache load error', e); }

function tryHistoryEndpoint(i){
  if (i >= HISTORY_ENDPOINTS.length){
    state.historyStatus = 'error';
    render();
    return;
  }
  fetchWithTimeout(HISTORY_ENDPOINTS[i], 12000)
    .then(function(res){ if (!res.ok) throw new Error('HTTP ' + res.status); return res.json(); })
    .then(function(data){
      var list = Array.isArray(data) ? data : (data.history || data.data || []);
      list.forEach(function(entry){
        var key = entry.effective_date || entry.date;
        if (key && typeof entry.USD === 'number') state.bcvHistory[key] = entry.USD;
      });
      state.historyStatus = 'ok';
      saveCachedHistory();
      render();
    })
    .catch(function(err){
      console.error('BCV history fetch error (' + HISTORY_ENDPOINTS[i] + ')', err);
      tryHistoryEndpoint(i + 1);
    });
}
function addDaysStr(dateStr, delta){
  var d = new Date(dateStr + 'T00:00:00');
  d.setDate(d.getDate() + delta);
  return d.toISOString().slice(0,10);
}
function mondayOf(dateStr){
  var d = new Date(dateStr + 'T00:00:00');
  var day = d.getDay();
  var diff = (day === 0) ? -6 : (1 - day);
  d.setDate(d.getDate() + diff);
  return d.toISOString().slice(0,10);
}
function formatDayMonthShort(dateStr){
  var d = new Date(dateStr + 'T00:00:00');
  return pad2(d.getDate()) + ' ' + MONTHS_ES[d.getMonth()].slice(0,3);
}
function groupTxByWeek(txs){
  var map = {};
  txs.forEach(function(t){
    var wk = mondayOf(t.date);
    if (!map[wk]) map[wk] = { key: 'movweek-' + wk, start: wk, end: addDaysStr(wk, 6), txs: [], netUSD: 0, netVES: 0 };
    map[wk].txs.push(t);
    if (t.currency === 'USD') map[wk].netUSD += signedAmount(t); else map[wk].netVES += signedAmount(t);
  });
  var groups = Object.keys(map).map(function(k){ return map[k]; });
  groups.sort(function(a,b){ return a.key < b.key ? 1 : -1; });
  groups.forEach(function(g){ g.txs.sort(function(a,b){ return a.date < b.date ? 1 : -1; }); });
  return groups;
}
function groupTxByCategory(txs){
  var map = {};
  txs.forEach(function(t){
    if (!map[t.category]) map[t.category] = { key: 'movcat-' + t.category, label: catLabel(t.category), txs: [], netUSD: 0, netVES: 0 };
    map[t.category].txs.push(t);
    if (t.currency === 'USD') map[t.category].netUSD += signedAmount(t); else map[t.category].netVES += signedAmount(t);
  });
  var groups = Object.keys(map).map(function(k){ return map[k]; });
  groups.sort(function(a,b){
    var magA = Math.abs(a.netVES) + Math.abs(a.netUSD) * 1000;
    var magB = Math.abs(b.netVES) + Math.abs(b.netUSD) * 1000;
    return magB - magA;
  });
  groups.forEach(function(g){ g.txs.sort(function(a,b){ return a.date < b.date ? 1 : -1; }); });
  return groups;
}
function groupDayRowsByWeek(rows, prefix){
  var map = {};
  rows.forEach(function(r){
    var wk = mondayOf(r.date);
    if (!map[wk]) map[wk] = { key: prefix + wk, start: wk, end: addDaysStr(wk, 6), rows: [], netUSD: 0, netVES: 0 };
    map[wk].rows.push(r);
    map[wk].netUSD += r.netUSD;
    map[wk].netVES += r.netVES;
  });
  var groups = Object.keys(map).map(function(k){ return map[k]; });
  groups.sort(function(a,b){ return a.key < b.key ? 1 : -1; });
  groups.forEach(function(g){ g.rows.sort(function(a,b){ return a.date < b.date ? 1 : -1; }); });
  return groups;
}
function setMovGroupBy(v){ state.movGroupBy = v; state.expandedGroups = {}; render(); }
function isGroupExpanded(key, index){
  if (Object.prototype.hasOwnProperty.call(state.expandedGroups, key)) return state.expandedGroups[key];
  return index === 0;
}
function toggleGroup(key, index){
  var current = isGroupExpanded(key, index);
  state.expandedGroups[key] = !current;
  render();
}
function getRateForDate(dateStr){
  if (state.bcvHistory[dateStr]) return state.bcvHistory[dateStr];
  for (var i = 1; i <= 60; i++){
    var earlier = addDaysStr(dateStr, -i);
    if (state.bcvHistory[earlier]) return state.bcvHistory[earlier];
  }
  if (dateStr === todayStr() && state.bcvRate.usd) return state.bcvRate.usd;
  return state.bcvRate.usd || null;
}

/* ---------- derived data ---------- */
function getViewDate(){
  var d = new Date();
  d.setDate(1);
  d.setMonth(d.getMonth() + state.monthOffset);
  return d;
}
function getMonthTx(){
  var key = getViewDate().toISOString().slice(0,7);
  return state.transactions
    .filter(function(t){ return monthKeyOf(t.date) === key; })
    .sort(function(a,b){ return a.date < b.date ? 1 : -1; });
}
function getTotals(monthTx){
  var t = { incomeUSD:0, incomeVES:0, expenseUSD:0, expenseVES:0 };
  monthTx.forEach(function(tx){
    var key = (tx.type==='ingreso' ? 'income' : 'expense') + tx.currency;
    t[key] += Number(tx.amount) || 0;
  });
  return t;
}
function getCategoryBreakdown(monthTx){
  var map = {};
  monthTx.filter(function(t){ return t.type==='egreso'; }).forEach(function(tx){
    if (!map[tx.category]) map[tx.category] = { category: tx.category, ves: 0, usd: 0 };
    if (tx.currency === 'USD') map[tx.category].usd += Number(tx.amount) || 0;
    else map[tx.category].ves += Number(tx.amount) || 0;
  });
  var rows = Object.keys(map).map(function(k){ return map[k]; });
  rows.sort(function(a,b){
    var magA = Math.abs(a.ves) + Math.abs(a.usd) * 1000;
    var magB = Math.abs(b.ves) + Math.abs(b.usd) * 1000;
    return magB - magA;
  });
  return rows;
}

function signedAmount(tx){
  var sign = tx.type === 'ingreso' ? 1 : -1;
  return sign * (Number(tx.amount) || 0);
}

function getCurrentBalance(){
  var usd = state.initialBalance.usd, ves = state.initialBalance.ves;
  state.transactions.forEach(function(tx){
    if (tx.currency === 'USD') usd += signedAmount(tx); else ves += signedAmount(tx);
  });
  return { usd: usd, ves: ves };
}

function pad2(n){ return n < 10 ? '0'+n : ''+n; }

function getDailyBalances(){
  var vd = getViewDate();
  var year = vd.getFullYear(), month = vd.getMonth();
  var lastDayOfMonth = new Date(year, month + 1, 0).getDate();
  var today = new Date();
  var isCurrentMonth = (today.getFullYear() === year && today.getMonth() === month);
  var lastDay = isCurrentMonth ? today.getDate() : lastDayOfMonth;
  var monthStart = year + '-' + pad2(month + 1) + '-01';

  var dailyNet = {};
  state.transactions.forEach(function(tx){
    dailyNet[tx.date] = dailyNet[tx.date] || { usd: 0, ves: 0, count: 0 };
    dailyNet[tx.date][tx.currency === 'USD' ? 'usd' : 'ves'] += signedAmount(tx);
    dailyNet[tx.date].count += 1;
  });

  var runningUSD = state.initialBalance.usd, runningVES = state.initialBalance.ves;
  var sortedDates = state.transactions.map(function(t){ return t.date; }).sort();
  var earliestDate = sortedDates.length ? sortedDates[0] : monthStart;
  var openingRate = getRateForDate(earliestDate < monthStart ? earliestDate : monthStart);
  var runningCombined = state.initialBalance.usd + (openingRate ? state.initialBalance.ves / openingRate : 0);

  var priorTx = state.transactions.filter(function(t){ return t.date < monthStart; }).sort(function(a,b){ return a.date < b.date ? -1 : 1; });
  priorTx.forEach(function(tx){
    var amt = signedAmount(tx);
    if (tx.currency === 'USD'){
      runningUSD += amt; runningCombined += amt;
    } else {
      runningVES += amt;
      var r = getRateForDate(tx.date);
      if (r) runningCombined += amt / r;
    }
  });

  var rows = [];
  for (var d = 1; d <= lastDay; d++){
    var dateStr = year + '-' + pad2(month + 1) + '-' + pad2(d);
    var net = dailyNet[dateStr] || { usd: 0, ves: 0, count: 0 };
    var dayRate = getRateForDate(dateStr);
    var netCombined = net.usd + (dayRate ? net.ves / dayRate : 0);
    runningUSD += net.usd;
    runningVES += net.ves;
    runningCombined += netCombined;
    rows.push({ date: dateStr, day: d, netUSD: net.usd, netVES: net.ves, hasTx: net.count > 0, balanceUSD: runningUSD, balanceVES: runningVES, dayRate: dayRate, netCombined: netCombined, balanceCombined: runningCombined });
  }
  return rows;
}

function getMonthOpeningBalance(){
  var vd = getViewDate();
  var monthStart = vd.getFullYear() + '-' + pad2(vd.getMonth() + 1) + '-01';
  var usd = state.initialBalance.usd, ves = state.initialBalance.ves;
  state.transactions.forEach(function(tx){
    if (tx.date < monthStart){
      if (tx.currency === 'USD') usd += signedAmount(tx); else ves += signedAmount(tx);
    }
  });
  return { usd: usd, ves: ves };
}

function saveTransaction(){
  var f = state.form;
  var amt = Number(f.amount);
  if (!(amt > 0) || !f.date) return;
  if (state.editingId){
    var idx = state.transactions.findIndex(function(t){ return t.id === state.editingId; });
    if (idx > -1){
      var existing = state.transactions[idx];
      state.transactions[idx] = {
        id: existing.id, type: f.type, category: f.category, amount: amt,
        currency: f.currency, date: f.date, note: (f.note||'').trim(),
        source: existing.source
      };
    }
  } else {
    state.transactions.unshift({
      id: uid(), type: f.type, category: f.category, amount: amt,
      currency: f.currency, date: f.date, note: (f.note||'').trim()
    });
  }
  saveData();
  state.showForm = false;
  state.editingId = null;
  render();
  pushToCloud();
}

function importAugustSeed(){
  var RANGE_START = '2026-08-01', RANGE_END = '2026-08-31';
  var existingInRange = state.transactions.filter(function(t){ return t.date >= RANGE_START && t.date <= RANGE_END; });
  var msg = existingInRange.length > 0
    ? 'Se encontraron ' + existingInRange.length + ' movimientos ya cargados entre el 01 y el 18 de agosto (posibles duplicados de versiones anteriores). Esto los eliminará TODOS —sin importar cómo se cargaron— y pondrá los ' + AUGUST_2026_SEED.transactions.length + ' movimientos correctos desde cero. ¿Continuar?'
    : 'Esto agregará ' + AUGUST_2026_SEED.transactions.length + ' movimientos de agosto 2026 desde tu hoja de cálculo original. ¿Continuar?';
  if (!window.confirm(msg)) return;

  state.transactions = state.transactions.filter(function(t){ return !(t.date >= RANGE_START && t.date <= RANGE_END); });

  var imported = AUGUST_2026_SEED.transactions.map(function(t){
    return { id: uid(), type: t.type, category: t.category, amount: t.amount, currency: t.currency, date: t.date, note: t.note || '', source: 'august_seed' };
  });
  state.transactions = imported.concat(state.transactions);
  state.initialBalance = { usd: AUGUST_2026_SEED.initialBalance.usd, ves: AUGUST_2026_SEED.initialBalance.ves };
  try { localStorage.setItem(STORAGE_KEY_BALANCE, JSON.stringify(state.initialBalance)); } catch(e){}
  saveData();
  state.monthOffset = 0;
  state.view = 'movimientos';
  render();
  pushToCloud();
  window.alert('Listo. Se eliminaron ' + existingInRange.length + ' movimientos previos y se cargaron ' + imported.length + ' movimientos correctos de agosto 2026.');
}

/* ---------- render ---------- */
function esc(s){ return (s==null?'':String(s)).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }

function renderLockScreen(){
  var html = '<div class="lock-screen">';
  html += '  <div class="lock-icon" style="color:var(--gold)">' + ICONS.wallet2 + '</div>';
  html += '  <div class="wordmark" style="font-size:28px;margin-top:14px">Tu Bolsillo</div>';
  html += '  <div class="lock-sub">Ingresa el PIN familiar</div>';
  html += '  <input class="input lock-input" type="password" inputmode="numeric" maxlength="6" id="pinInput" placeholder="••••" value="' + esc(state.pinInput||'') + '" oninput="setPinInput(this.value)" onkeyup="if(event.key===\'Enter\') submitPin()">';
  if (state.pinError) html += '<div class="lock-error">PIN incorrecto, intenta de nuevo.</div>';
  html += '  <button class="primary-btn lock-btn" onclick="submitPin()">Entrar</button>';
  html += '</div>';
  return html;
}

function render(){
  var root = document.getElementById('app');
  if (state.locked){
    root.innerHTML = renderLockScreen();
    var pinEl = document.getElementById('pinInput');
    if (pinEl) pinEl.focus();
    return;
  }
  var monthTx = getMonthTx();
  var totals = getTotals(monthTx);
  var breakdown = getCategoryBreakdown(monthTx);
  var viewDate = getViewDate();
  var monthLabel = MONTHS_ES[viewDate.getMonth()] + ' ' + viewDate.getFullYear();

  var html = '';
  html += '<div class="header">';
  html += '  <div><div class="wordmark">Tu Bolsillo</div></div>';
  html += '  <div style="display:flex;align-items:center;gap:8px">' + renderSyncBadge() + '<span style="color:var(--gold)">' + ICONS.wallet2 + '</span></div>';
  html += '</div>';

  if (state.saveError){
    html += '<div class="warn-banner">No se pudo guardar en este navegador. Revisa que no estés en modo privado.</div>';
  }

  html += '<div class="month-nav">';
  html += '  <button class="icon-btn" onclick="changeMonth(-1)">' + ICONS.chevronLeft + '</button>';
  html += '  <div class="month-label">' + esc(monthLabel) + '</div>';
  html += '  <button class="icon-btn" ' + (state.monthOffset>=0?'disabled':'') + ' onclick="changeMonth(1)">' + ICONS.chevronRight + '</button>';
  html += '</div>';

  if (state.view === 'resumen') html += renderRateBar();

  html += '<div class="main">';
  if (state.view === 'resumen') html += renderResumen(totals, breakdown);
  else if (state.view === 'movimientos') html += renderMovimientos(monthTx);
  else if (state.view === 'diario') html += renderDiario();
  else if (state.view === 'metas') html += renderMetas(totals, monthTx);
  else if (state.view === 'pagos') html += renderPagos();
  else if (state.view === 'ajustes') html += renderAjustes();
  html += '</div>';

  html += '<nav class="bottom-nav">';
  html += navBtn('resumen', ICONS.grid, 'Resumen');
  html += navBtn('movimientos', ICONS.list, 'Movim.');
  html += '  <button class="nav-add-btn" onclick="openForm()">' + ICONS.plus + '</button>';
  html += navBtn('diario', ICONS.calendar, 'Diario');
  html += navBtn('metas', ICONS.target, 'Metas');
  html += navBtn('pagos', ICONS.calendar, 'Pago');
  html += navBtn('ajustes', ICONS.settings, 'Ajustes');
  html += '</nav>';

  root.innerHTML = html;

  if (state.showForm) renderFormSheet();
}

function renderRateBar(){
  var r = state.bcvRate;
  var label, sub;
  if (state.rateStatus === 'loading' && !r.usd){
    label = 'Consultando tasa BCV…';
    sub = '';
  } else if (r.usd){
    label = 'BCV hoy: ' + fmt(r.usd, 'VES') + ' / $';
    sub = r.date ? 'Vigente ' + esc(r.date) : '';
    if (state.rateStatus === 'error') sub = 'Sin conexión · última tasa guardada' + (r.date ? ' (' + esc(r.date) + ')' : '');
  } else {
    label = 'Tasa BCV no disponible';
    sub = state.rateStatus === 'error' ? 'No se pudo conectar. Verifica tu internet.' : '';
  }
  var spinning = state.rateStatus === 'loading';
  var html = '<div class="rate-bar">';
  html += '  <div><div class="rate-label">' + label + '</div>' + (sub ? '<div class="rate-sub">' + sub + '</div>' : '') + '</div>';
  html += '  <button class="icon-btn ' + (spinning?'spin':'') + '" onclick="fetchBcvRate()" title="Actualizar tasa">' + ICONS.refresh + '</button>';
  html += '</div>';
  return html;
}

function renderSyncBadge(){
  if (!isFirebaseConfigured()) return '';
  var color = state.syncStatus === 'synced' ? 'var(--teal)' : (state.syncStatus === 'error' ? 'var(--coral)' : 'var(--text-faint)');
  var label = state.syncStatus === 'synced' ? 'Sincronizado' : (state.syncStatus === 'error' ? 'Sin conexión' : 'Conectando…');
  return '<span title="' + label + '" style="width:8px;height:8px;border-radius:50%;background:' + color + ';display:inline-block"></span>';
}

function navBtn(view, icon, label){
  var active = state.view === view;
  return '<button class="nav-btn ' + (active?'active':'') + '" onclick="setView(\'' + view + '\')">' + icon + '<span>' + label + '</span></button>';
}

function renderCatCurrencyLine(amount, currency, maxAmt, budgetAmt, budgetIsConverted, budgetOrigAmt, budgetOrigCurrency){
  var pct = Math.max(4, Math.round((amount / maxAmt) * 100));
  var barColor = 'var(--coral)';
  var badge = '';
  var bottomLine = '<div class="cat-currency-bottom">' + fmt(amount, currency) + '</div>';
  if (budgetAmt > 0){
    var bpct = Math.round((amount / budgetAmt) * 100);
    var badgeClass = 'badge-ok';
    if (bpct >= 100){ barColor = '#ff5c5c'; badgeClass = 'badge-over'; }
    else if (bpct >= 80){ barColor = '#E0A94E'; badgeClass = 'badge-warn'; }
    badge = '<span class="cat-pct-badge ' + badgeClass + '">' + bpct + '%' + (bpct>=100?' ⚠':'') + '</span>';
    var budgetDesc = budgetIsConverted
      ? ('≈ ' + fmt(budgetAmt, currency) + ' <span class="cat-budget-of">(presupuesto: ' + fmt(budgetOrigAmt, budgetOrigCurrency) + ' a la tasa de hoy)</span>')
      : (fmt(budgetAmt, currency) + budgetEquivalentInline(budgetAmt, currency));
    bottomLine = '<div class="cat-currency-bottom">' + fmt(amount, currency) + ' <span class="cat-budget-of">de</span> ' + budgetDesc + '</div>';
  }
  var html = '<div class="cat-currency-line">';
  html += '  <div class="cat-currency-top"><span class="cat-currency-tag">' + (currency==='USD'?'$':'Bs.') + '</span>' + badge + '</div>';
  html += '  <div class="bar-track"><div class="bar-fill" style="width:' + pct + '%;background:' + barColor + '"></div></div>';
  html += bottomLine;
  html += '</div>';
  return html;
}

function renderPaymentAlerts(){
  var upcoming = getUpcomingPayments().filter(function(p){ return p.diffDays <= 7; });
  if (!upcoming.length) return '';

  var byCat = {};
  upcoming.forEach(function(p){
    if (!byCat[p.catId]) byCat[p.catId] = { catId: p.catId, label: p.label, items: [], minDiff: p.diffDays };
    byCat[p.catId].items.push(p);
    if (p.diffDays < byCat[p.catId].minDiff) byCat[p.catId].minDiff = p.diffDays;
  });
  var groups = Object.keys(byCat).map(function(k){ return byCat[k]; });
  groups.sort(function(a,b){ return a.minDiff - b.minDiff; });

  var html = '<div class="section-label" style="color:var(--coral);font-weight:700;letter-spacing:1.2px">⚠ Próximos pagos</div>';
  groups.forEach(function(g, gi){
    var key = 'resumenpago-' + g.catId;
    var expanded = isGroupExpanded(key, gi);
    var color = g.minDiff < 0 ? '#ff5c5c' : (g.minDiff <= 2 ? '#E0A94E' : 'var(--text-dim)');
    var headerText = g.minDiff < 0 ? ('Venció hace ' + Math.abs(g.minDiff) + ' día' + (Math.abs(g.minDiff)===1?'':'s'))
      : g.minDiff === 0 ? 'Vence hoy'
      : g.minDiff === 1 ? 'Vence mañana'
      : ('Vence en ' + g.minDiff + ' días');

    html += '<button class="group-header group-header-btn" onclick="toggleGroup(\'' + key + '\',' + gi + ')">';
    html += '  <span class="group-title-wrap"><span class="group-chevron ' + (expanded?'open':'') + '">' + ICONS.chevronDown + '</span><span class="group-title">' + esc(g.label) + '</span></span>';
    html += '  <span class="group-net" style="color:' + color + '">' + (g.items.length>1 ? (g.items.length+' pagos · ') : '') + headerText + '</span>';
    html += '</button>';

    if (expanded){
      html += '<div class="ledger-list" style="margin-bottom:18px">';
      g.items.sort(function(a,b){ return a.diffDays - b.diffDays; }).forEach(function(p){
        var pColor = p.diffDays < 0 ? '#ff5c5c' : (p.diffDays <= 2 ? '#E0A94E' : 'var(--text-dim)');
        var pText = p.diffDays < 0 ? ('Venció hace ' + Math.abs(p.diffDays) + ' día' + (Math.abs(p.diffDays)===1?'':'s'))
          : p.diffDays === 0 ? 'Vence hoy'
          : p.diffDays === 1 ? 'Vence mañana'
          : ('Vence en ' + p.diffDays + ' días');
        html += '<div class="tx-row">';
        html += '  <span class="tx-dot" style="background:' + pColor + '"></span>';
        html += '  <div style="flex:1;min-width:0"><div class="tx-label">' + esc(formatDayMonthShort(p.date)) + (p.note?(' · '+esc(p.note)):'') + '</div></div>';
        html += '  <div style="text-align:right;font-family:var(--font-mono);font-size:11px;font-weight:700;color:' + pColor + '">' + pText + (p.amount ? ('<div style="font-size:10.5px;color:var(--text-faint);font-weight:400">' + fmt(p.amount,p.currency||'VES') + budgetEquivalentInline(p.amount, p.currency||'VES') + '</div>') : '') + '</div>';
        html += '</div>';
      });
      html += '</div>';
    }
  });
  return html;
}

  var gastosCatExpanded = isGroupExpanded(gastosCatKey, -1);
  html += '<button class="group-header group-header-btn" onclick="toggleGroup(\'' + gastosCatKey + '\',-1)">';
  html += '  <span class="group-title-wrap"><span class="group-chevron ' + (gastosCatExpanded?'open':'') + '">' + ICONS.chevronDown + '</span><span class="group-title">Gastos por categoría</span></span>';
  html += '  <span class="group-net" style="color:var(--gold);font-weight:700">' + breakdown.length + ' categoría' + (breakdown.length===1?'':'s') + '</span>';
  html += '</button>';
  if (!gastosCatExpanded){
    return html;
  }
  if (breakdown.length === 0){
    html += '<div class="empty-note">Aún no registras egresos este mes.</div>';
  } else {
    var maxVes = Math.max.apply(null, breakdown.map(function(r){ return r.ves; }).concat([1]));
    var maxUsd = Math.max.apply(null, breakdown.map(function(r){ return r.usd; }).concat([1]));
    var todayRate = getRateForDate(todayStr());
    html += '<div class="ledger-list">';
    breakdown.forEach(function(row){
      var budget = state.budgets[row.category] || {};
      var vesBudget = budget.ves || 0, vesConverted = false;
      var usdBudget = budget.usd || 0, usdConverted = false;
      if (!vesBudget && budget.usd > 0 && todayRate){ vesBudget = budget.usd * todayRate; vesConverted = true; }
      if (!usdBudget && budget.ves > 0 && todayRate){ usdBudget = budget.ves / todayRate; usdConverted = true; }
      html += '<div class="cat-row">';
      html += '  <div class="cat-row-top"><span class="cat-label">' + esc(catLabel(row.category)) + '</span></div>';
      if (row.ves > 0) html += renderCatCurrencyLine(row.ves, 'VES', maxVes, vesBudget, vesConverted, budget.usd, 'USD');
      if (row.usd > 0) html += renderCatCurrencyLine(row.usd, 'USD', maxUsd, usdBudget, usdConverted, budget.ves, 'VES');
      html += '</div>';
    });
    html += '</div>';
  }
  return html;
}

    html += '</span>';

    if (!expanded){ return; }

    html += '<div class="ledger-list" style="margin-bottom:20px">';
    var lastDate = null;

        html += '<div class="day-divider">' + esc(DAYS_ES[dd.getDay()]) + ' ' + formatDayMonthShort(t.date) + '</div>';
      }
      var isIncome = t.type === 'ingreso';
      html += '<div class="tx-row">';
      html += '  <span class="tx-dot" style="background:' + (isIncome?'var(--teal)':'var(--coral)') + '"></span>';
      html += '  <div style="flex:1;min-width:0">';

      html += '    <div class="tx-date">' + esc(t.date) + (t.note ? ' · ' + esc(t.note) : '') + '</div>';
      html += '  </div>';
      html += '  <div class="tx-amount" style="color:' + (isIncome?'var(--teal)':'var(--coral)') + '">' + (isIncome?'+ ':'\u2212 ') + fmt(t.amount, t.currency) + '</div>';
      html += '  <button class="trash-btn" onclick="editTransaction(\'' + t.id + '\')" title="Editar">' + ICONS.edit + '</button>';
      html += '  <button class="trash-btn" onclick="deleteTransaction(\'' + t.id + '\')" title="Eliminar">' + ICONS.trash + '</button>';
      html += '</div>';
    });
    html += '</div>';
  });

  return html;
}

function renderGoalRing(pct, colorOverride){
  var raw = pct;
  var clamped = Math.max(0, Math.min(100, pct));
  var r = 38, circ = 2 * Math.PI * r;
  var offset = circ - (clamped / 100) * circ;
  var color = colorOverride || (raw >= 100 ? 'var(--teal)' : (raw >= 60 ? 'var(--gold)' : 'var(--coral)'));
  var svg = '<svg width="92" height="92" viewBox="0 0 92 92" style="flex-shrink:0">';
  svg += '<circle cx="46" cy="46" r="' + r + '" fill="none" stroke="var(--surface-2)" stroke-width="9"/>';
  svg += '<circle cx="46" cy="46" r="' + r + '" fill="none" stroke="' + color + '" stroke-width="9" stroke-linecap="round" stroke-dasharray="' + circ + '" stroke-dashoffset="' + offset + '" transform="rotate(-90 46 46)"/>';
  svg += '<text x="46" y="52" text-anchor="middle" font-family="var(--font-mono)" font-size="18" font-weight="700" fill="' + color + '">' + Math.round(raw) + '%</text>';
  svg += '</svg>';
  return svg;
}

function renderGoalRingCard(label, saved, totalTarget, currency, startAmt, goalIncrement){
  var pct = totalTarget > 0 ? Math.round((saved / totalTarget) * 100) : 0;
  var isNegative = saved < 0;
  var amountColor = isNegative ? 'var(--coral)' : 'var(--text)';
  var html = '<div class="goal-ring-card">';
  html += '  ' + (totalTarget > 0 ? renderGoalRing(pct) : renderGoalRing(0, 'var(--text-faint)'));
  html += '  <div class="goal-ring-body">';
  html += '    <div class="goal-ring-label">' + esc(label) + '</div>';
  html += '    <div class="goal-ring-numbers" style="color:' + amountColor + '">' + (isNegative ? '− ' : '+ ') + fmt(saved, currency) + '</div>';
  html += '    <div class="goal-ring-of">' + (totalTarget > 0 ? ('meta total: ' + fmt(totalTarget, currency)) : 'sin meta definida') + '</div>';
  if (startAmt !== undefined && goalIncrement !== undefined && goalIncrement > 0){
    html += '    <div class="goal-ring-of">' + fmt(startAmt, currency) + ' + ' + fmt(goalIncrement, currency) + ' nuevos = ' + fmt(startAmt + goalIncrement, currency) + '</div>';
  }
  html += '  </div>';
  html += '</div>';
  return html;
}

function renderGoalCard(label, saved, goalAmt, currency){
  var pct = goalAmt > 0 ? Math.min(100, Math.max(0, Math.round((saved/goalAmt)*100))) : 0;
  var html = '<div class="goal-card">';
  html += '  <div class="goal-row"><span>' + esc(label) + '</span><span class="goal-pct">' + pct + '%</span></div>';
  html += '  <div class="bar-track"><div class="bar-fill-gold" style="width:' + pct + '%"></div></div>';
  html += '  <div class="goal-numbers">' + fmt(saved,currency) + ' de ' + fmt(goalAmt,currency) + '</div>';
  html += '</div>';
  return html;
}

function saveAhorroCompleto(period){
  var currentUsd = document.getElementById('ahorroCurrentUsd_' + period).value;
  var currentVes = document.getElementById('ahorroCurrentVes_' + period).value;
  var goalUsd = document.getElementById('ahorroGoalUsd_' + period).value;
  var goalVes = document.getElementById('ahorroGoalVes_' + period).value;

  state.currentSavings[period] = { usd: Number(currentUsd)||0, ves: Number(currentVes)||0 };
  state.goal[period] = { usd: Number(goalUsd)||0, ves: Number(goalVes)||0 };

  saveSavingsToStorage();
  saveData();
  render();
  pushToCloud();
}

function renderMetasSemanal(monthTx){
  var g = state.goal.weekly;
  var s = state.currentSavings.weekly;
  var st = state.savingsStart.weekly;
  var totalTargetUSD = st.usd + g.usd;
  var totalTargetVES = st.ves + g.ves;
  var weeks = groupTxByWeek(monthTx);
  var todayMonday = mondayOf(todayStr());
  var currentWeek = weeks.find(function(w){ return w.start === todayMonday; });
  var currentWeekLabel = currentWeek ? (formatDayMonthShort(currentWeek.start) + '–' + formatDayMonthShort(currentWeek.end)) : (formatDayMonthShort(todayMonday) + '–' + formatDayMonthShort(addDaysStr(todayMonday,6)));
  var otherWeeks = weeks.filter(function(w){ return w.start !== todayMonday; });

  var html = '<div class="section-label">Esta semana (' + currentWeekLabel + ')</div>';
  html += renderGoalRingCard('Ahorro actual (USD)', s.usd, totalTargetUSD, 'USD', st.usd, g.usd);
  html += renderGoalRingCard('Ahorro actual (Bs.)', s.ves, totalTargetVES, 'VES', st.ves, g.ves);
  html += renderAhorroForm('weekly');

  html += '<div class="section-label" style="margin-top:22px">Semanas anteriores (ingresos − egresos)</div>';
  if (otherWeeks.length === 0){
    html += '<div class="empty-note" style="padding-top:0">No hay más semanas registradas este mes.</div>';
  } else {
    otherWeeks.forEach(function(w){
      var label = 'Semana ' + formatDayMonthShort(w.start) + ' – ' + formatDayMonthShort(w.end);

      html += '<div class="goal-card">';
      html += '  <div class="goal-row"><span>' + esc(label) + '</span></div>';
      if (g.usd > 0){
        var pu = Math.min(100, Math.max(0, Math.round((w.netUSD/g.usd)*100)));
        html += '  <div class="bar-track"><div class="bar-fill-gold" style="width:' + pu + '%"></div></div>';
        html += '  <div class="goal-numbers">' + fmt(w.netUSD,'USD') + ' de ' + fmt(g.usd,'USD') + (cumplioUSD!==null ? (cumplioUSD?' · Cumplió':' · No cumplió') : '') + '</div>';
      }
      if (g.ves > 0){
        var pv = Math.min(100, Math.max(0, Math.round((w.netVES/g.ves)*100)));
        html += '  <div class="bar-track" style="margin-top:6px"><div class="bar-fill-gold" style="width:' + pv + '%"></div></div>';
        html += '  <div class="goal-numbers">' + fmt(w.netVES,'VES') + ' de ' + fmt(g.ves,'VES') + (cumplioVES!==null ? (cumplioVES?' · Cumplió':' · No cumplió') : '') + '</div>';
      }
      if (g.usd === 0 && g.ves === 0){
        html += '  <div class="goal-numbers">Neto: ' + fmt(w.netUSD,'USD') + ' / ' + fmt(w.netVES,'VES') + '</div>';
      }
      html += '</div>';
    });
  }
  return html;
}

  } else {
    html += '<div class="empty-note" style="padding-top:0">Protege la app con un PIN para que no cualquiera que tenga el link vea tus finanzas.</div>';
    html += '<div class="form-group"><label class="form-label">Crear PIN (4 a 6 números)</label><input class="input" type="password" inputmode="numeric" maxlength="6" id="newPinInput" placeholder="••••"></div>';
    html += '<button class="primary-btn" onclick="changePin()">Crear PIN</button>';
  }
  return html;
}

function renderRespaldo(){
  var html = '<div class="section-label" style="margin-top:26px">Respaldo de datos</div>';
  html += '<div class="empty-note" style="padding-top:0">Descarga una copia de tus movimientos, por si algún día necesitas recuperarlos. Elige el formato que prefieras.</div>';

  html += '<div class="export-option">';
  html += '  <div class="export-option-title">Hoja de Excel</div>';
  html += '  <div class="export-option-desc">Categorías en filas, días en columnas, con Balance Inicial y Total Ahorro Actual — del mes que estés viendo en Resumen. Se descarga como archivo .xlsx, ya formateado y listo para abrir en Excel.</div>';
  html += '  <button class="primary-btn" style="background:var(--surface-2);color:var(--gold);border:1px solid var(--gold)" onclick="exportExcel(this)">Descargar Excel</button>';
  html += '</div>';

  html += '<div class="export-option">';
  html += '  <div class="export-option-title">Respaldo técnico completo</div>';
  html += '  <div class="export-option-desc">Archivo JSON con todo: movimientos, metas, presupuestos, saldo inicial. Para restaurar todo exacto si algo se pierde.</div>';
  html += '  <button class="primary-btn" style="background:var(--surface-2);color:var(--gold);border:1px solid var(--gold)" onclick="exportJSON()">Descargar respaldo (JSON)</button>';
  html += '</div>';

  return html;
}

function setMetasScreen(s){ state.metasScreen = s; render(); }
function setAjustesScreen(s){ state.ajustesScreen = s; render(); }

function renderMetasMenuCard(icon, title, subtitle, screen, target){
  var fn = target === 'ajustes' ? 'setAjustesScreen' : 'setMetasScreen';
  var html = '<button class="menu-card" onclick="' + fn + '(\'' + screen + '\')">';
  html += '  <span class="menu-card-icon">' + icon + '</span>';
  html += '  <span class="menu-card-body"><span class="menu-card-title">' + esc(title) + '</span><span class="menu-card-sub">' + esc(subtitle) + '</span></span>';
  html += '  <span class="menu-card-chevron">' + ICONS.chevronRight + '</span>';
  html += '</button>';
  return html;
}

function renderMetasBack(title, target){
  var fn = target === 'ajustes' ? 'setAjustesScreen' : 'setMetasScreen';
  return '<button class="back-btn" onclick="' + fn + '(\'home\')">' + ICONS.chevronLeft + '<span>' + esc(title) + '</span></button>';
}

function renderAjustesHome(){
  var html = '<div class="section-label">Ajustes</div>';
  html += renderMetasMenuCard(ICONS.grid, 'Presupuesto por categoría', 'Límites de gasto con alertas', 'presupuesto', 'ajustes');
  html += renderMetasMenuCard(ICONS.wallet, 'Seguridad', state.pinHash ? 'PIN activo' : 'Sin PIN configurado', 'seguridad', 'ajustes');
  html += renderMetasMenuCard(ICONS.calendar, 'Respaldo de datos', 'Exportar a CSV o JSON', 'respaldo', 'ajustes');
  html += renderMetasMenuCard(ICONS.wallet2, 'Saldo inicial y datos importados', 'Punto de partida y carga de agosto', 'saldo', 'ajustes');
  return html;
}

function renderNotificationBanner(){
  var status = getNotificationStatus();
  var html = '<div class="goal-card" style="margin-bottom:18px">';
  if (status === 'granted'){
    html += '  <div class="goal-row"><span>🔔 Notificaciones activas</span></div>';
    html += '  <div class="goal-numbers">Te avisaremos en el celular cuando abras la app y haya pagos por vencer (hasta 3 días antes).</div>';
  } else if (status === 'denied'){
    html += '  <div class="goal-row"><span>🔕 Notificaciones bloqueadas</span></div>';
    html += '  <div class="goal-numbers">Las bloqueaste antes. Actívalas desde los ajustes de notificaciones de tu navegador o del sistema para esta app.</div>';
  } else if (status === 'unsupported'){
    html += '  <div class="goal-row"><span>🔕 No disponible aquí</span></div>';
    html += '  <div class="goal-numbers">Este navegador no soporta notificaciones. Prueba desde la app instalada.</div>';
  } else {
    html += '  <div class="goal-row"><span>🔔 Activar notificaciones</span></div>';
    html += '  <div class="goal-numbers">Recibe un aviso en el celular cuando un pago esté por vencer.</div>';
    html += '  <button class="primary-btn" style="margin-top:10px" onclick="requestNotificationPermission()">Activar notificaciones</button>';
  }
  html += '</div>';
  return html;
}

function renderPagos(){
  var html = '<div class="section-label">Compromisos de pago</div>';
  html += '<div class="empty-note" style="padding-top:0">Agrega las fechas de pago de cada categoría (pueden ser varias, ej. cuotas de Cashea). En Resumen aparecerá un aviso cuando se acerquen o venzan.</div>';
  html += renderNotificationBanner();

  var grandUSD = 0, grandVES = 0;
  PAYMENT_CATEGORIES.forEach(function(catId){
    (state.paymentCommitments[catId] || []).forEach(function(p){
      if (p.currency === 'USD') grandUSD += Number(p.amount)||0; else grandVES += Number(p.amount)||0;
    });
  });
  if (grandUSD > 0 || grandVES > 0){
    html += '<div class="goal-card" style="margin-bottom:18px">';
    html += '  <div class="goal-row"><span>Total de Pagos</span></div>';
    html += '  <div class="goal-numbers" style="font-size:14px;font-weight:700;color:var(--gold)">' + (grandUSD>0?fmt(grandUSD,'USD'):'') + (grandUSD>0&&grandVES>0?' + ':'') + (grandVES>0?fmt(grandVES,'VES'):'') + '</div>';
    html += '</div>';
  }

  var sortedCategories = PAYMENT_CATEGORIES.slice().sort(function(a, b){
    var hasA = (state.paymentCommitments[a] || []).length > 0;
    var hasB = (state.paymentCommitments[b] || []).length > 0;
    if (hasA === hasB) return 0;
    return hasA ? -1 : 1;
  });

  sortedCategories.forEach(function(catId, ri){
    var label = catLabel(catId);
    var key = 'pagoscat-' + catId;
    var expanded = isGroupExpanded(key, ri === 0 ? 0 : -1);
    var list = (state.paymentCommitments[catId] || []).slice().sort(function(a,b){ return a.date < b.date ? -1 : 1; });
    var subUSD = 0, subVES = 0;
    list.forEach(function(p){ if (p.currency==='USD') subUSD += Number(p.amount)||0; else subVES += Number(p.amount)||0; });

    html += '<button class="group-header group-header-btn" onclick="toggleGroup(\'' + key + '\',' + (ri===0?0:-1) + ')">';
    html += '  <span class="group-title-wrap"><span class="group-chevron ' + (expanded?'open':'') + '">' + ICONS.chevronDown + '</span><span class="group-title">' + esc(label) + '</span></span>';
    if (subUSD > 0 || subVES > 0){
      html += '  <span class="group-net-badge">';
      if (subUSD > 0) html += fmt(subUSD,'USD');
      if (subUSD > 0 && subVES > 0) html += ' + ';
      if (subVES > 0) html += fmt(subVES,'VES');
      html += '</span>';
    } else {
      html += '  <span class="group-net-badge">' + list.length + ' fecha' + (list.length===1?'':'s') + '</span>';
    }
    html += '</button>';

    if (expanded){
      var editing = state.editingPayment && state.editingPayment.catId === catId ? state.editingPayment : null;
      var editItem = null;
      if (editing) editItem = (state.paymentCommitments[catId]||[]).find(function(p){ return p.id === editing.id; });

      if (list.length){
        html += '<div class="ledger-list" style="margin-bottom:12px">';
        list.forEach(function(p){
          var isEditing = editing && editing.id === p.id;
          html += '<div class="tx-row" style="' + (isEditing ? 'border:1px solid var(--gold)' : '') + '">';
          html += '  <span class="tx-dot" style="background:' + (p.paid?'var(--teal)':'var(--coral)') + '"></span>';
          html += '  <div style="flex:1;min-width:0"><div class="tx-label">' + esc(formatDayMonthShort(p.date)) + (p.note ? (' · ' + esc(p.note)) : '') + '</div>' + (p.amount ? ('<div class="tx-date">' + fmt(p.amount, p.currency||'VES') + budgetEquivalentInline(p.amount, p.currency||'VES') + '</div>') : '') + '</div>';
          html += '  <button class="trash-btn" style="width:auto;padding:4px 8px;font-family:var(--font-mono);font-size:10px;color:' + (p.paid?'var(--teal)':'var(--coral)') + '" onclick="togglePaymentPaid(\'' + catId + '\',\'' + p.id + '\')">' + (p.paid?'Pagado':'Pendiente') + '</button>';
          html += '  <button class="trash-btn" onclick="editPaymentDate(\'' + catId + '\',\'' + p.id + '\')" title="Editar">' + ICONS.edit + '</button>';
          html += '  <button class="trash-btn" onclick="deletePaymentDate(\'' + catId + '\',\'' + p.id + '\')" title="Eliminar">' + ICONS.trash + '</button>';
          html += '</div>';
        });
        html += '</div>';
      }

      html += '<div class="sheet-title" style="font-size:13px;margin-bottom:8px">' + (editItem ? 'Editar fecha' : 'Agregar fecha') + '</div>';
      html += '<div class="form-group"><label class="form-label">Fecha de pago</label><input class="input" type="date" id="payDate_' + catId + '" value="' + (editItem ? esc(editItem.date) : '') + '"></div>';
      html += '<div class="form-group"><label class="form-label">Nota (opcional)</label><input class="input" type="text" id="payNote_' + catId + '" placeholder="Ej. Cuota 2 de 3" value="' + (editItem ? esc(editItem.note||'') : '') + '"></div>';
      html += '<div class="form-row">';
      html += '  <div class="form-group" style="flex:1"><label class="form-label">Monto (opcional)</label><input class="input" type="number" inputmode="decimal" id="payAmount_' + catId + '" value="' + (editItem && editItem.amount ? editItem.amount : '') + '"></div>';
      html += '  <div class="form-group" style="width:90px"><label class="form-label">Moneda</label><select class="input" id="payCurrency_' + catId + '"><option value="USD" ' + (!editItem||editItem.currency==='USD'?'selected':'') + '>$</option><option value="VES" ' + (editItem&&editItem.currency==='VES'?'selected':'') + '>Bs.</option></select></div>';
      html += '</div>';
      html += '<button class="primary-btn" onclick="addPaymentDate(\'' + catId + '\')">' + (editItem ? 'Guardar cambios' : 'Agregar fecha') + '</button>';
      if (editItem) html += '<button class="primary-btn" style="background:var(--surface-2);color:var(--text-dim);border:1px solid var(--line);margin-top:8px" onclick="cancelEditPayment()">Cancelar edición</button>';
      html += '<div style="height:14px"></div>';
    }
  });
  return html;
}

function renderAjustes(){
  if (state.ajustesScreen === 'presupuesto') return renderMetasBack('Ajustes', 'ajustes') + renderPresupuesto();
  if (state.ajustesScreen === 'seguridad') return renderMetasBack('Ajustes', 'ajustes') + renderSeguridad();
  if (state.ajustesScreen === 'respaldo') return renderMetasBack('Ajustes', 'ajustes') + renderRespaldo();
  if (state.ajustesScreen === 'saldo') return renderMetasBack('Ajustes', 'ajustes') + renderMetasAjustes();
  return renderAjustesHome();
}

function renderMetasAjustes(){
  var html = '<div class="section-label">Saldo inicial</div>';
  html += '<div class="empty-note" style="padding-top:0">El punto de partida antes de tu primer movimiento registrado. Ajusta aquí si tu saldo actual no coincide con lo que tienes en la mano o en el banco.</div>';
  html += '<div class="form-group"><label class="form-label">Saldo inicial en USD</label><input class="input" type="number" inputmode="decimal" id="balUsdInput" value="' + state.initialBalance.usd + '"></div>';
  html += '<div class="form-group"><label class="form-label">Saldo inicial en Bs.</label><input class="input" type="number" inputmode="decimal" id="balVesInput" value="' + state.initialBalance.ves + '"></div>';
  html += '<button class="primary-btn" onclick="saveInitialBalance(document.getElementById(\'balUsdInput\').value, document.getElementById(\'balVesInput\').value)">Guardar saldo inicial</button>';

  html += '<div class="section-label" style="margin-top:26px">Importar datos existentes</div>';
  html += '<div class="empty-note" style="padding-top:0">Carga los ' + AUGUST_2026_SEED.transactions.length + ' movimientos del 01 al 18 de agosto desde tu hoja "Ingresos y Egresos Mes Agosto 2026", con el saldo inicial de esa fecha (' + fmt(AUGUST_2026_SEED.initialBalance.usd,'USD') + ' / ' + fmt(AUGUST_2026_SEED.initialBalance.ves,'VES') + '). Si ya habías importado antes, esto reemplaza esos datos en vez de duplicarlos.</div>';
  html += '<button class="primary-btn" style="background:var(--surface-2);color:var(--gold);border:1px solid var(--gold)" onclick="importAugustSeed()">Cargar 01–18 Agosto 2026</button>';
  return html;
}

function renderMetas(totals, monthTx){
  return renderMetasMensual(totals);
}

function renderFormSheet(){
  var f = state.form;
  var cats = f.type === 'egreso' ? EXPENSE_CATEGORIES : INCOME_CATEGORIES;
  var canSave = Number(f.amount) > 0 && f.date;
  var isEditing = !!state.editingId;

  var html = '';
  html += '<div class="sheet-overlay" onclick="closeForm()">';
  html += '  <div class="sheet" onclick="event.stopPropagation()">';
  html += '    <div class="sheet-handle"></div>';
  html += '    <div class="sheet-header"><span class="sheet-title">' + (isEditing ? 'Editar movimiento' : 'Nuevo movimiento') + '</span><button class="icon-btn" onclick="closeForm()">' + ICONS.x + '</button></div>';

  html += '    <div class="segmented">';
  html += '      <button class="segment-btn ' + (f.type==='egreso'?'active-coral':'') + '" onclick="setFormType(\'egreso\')">Egreso</button>';
  html += '      <button class="segment-btn ' + (f.type==='ingreso'?'active-teal':'') + '" onclick="setFormType(\'ingreso\')">Ingreso</button>';
  html += '    </div>';

  html += '    <div class="form-group" style="margin-top:12px"><label class="form-label">Categoría</label>';
  html += '      <select class="input" id="txCategory" onchange="setFormField(\'category\', this.value)">';
  cats.forEach(function(c){
    html += '<option value="' + c.id + '" ' + (f.category===c.id?'selected':'') + '>' + esc(c.label) + '</option>';
  });
  html += '      </select></div>';

  html += '    <div class="form-row">';
  html += '      <div class="form-group" style="flex:1"><label class="form-label">Monto</label><input class="input" type="number" inputmode="decimal" placeholder="0.00" id="txAmount" value="' + esc(f.amount) + '" oninput="setFormField(\'amount\', this.value); document.getElementById(\'saveTxBtn\').disabled = !(Number(this.value)>0)"></div>';
  html += '      <div class="form-group" style="width:100px"><label class="form-label">Moneda</label>';
  html += '        <div class="segmented">';
  html += '          <button class="segment-btn sm ' + (f.currency==='VES'?'active-gold':'') + '" onclick="setFormCurrency(\'VES\')">Bs.</button>';
  html += '          <button class="segment-btn sm ' + (f.currency==='USD'?'active-gold':'') + '" onclick="setFormCurrency(\'USD\')">$</button>';
  html += '        </div></div>';
  html += '    </div>';

  html += '    <div class="form-group"><label class="form-label">Fecha</label><input class="input" type="date" id="txDate" value="' + esc(f.date) + '" oninput="setFormField(\'date\', this.value)"></div>';
  html += '    <div class="form-group"><label class="form-label">Nota (opcional)</label><input class="input" type="text" placeholder="Ej. Mercado del mes" id="txNote" value="' + esc(f.note) + '" oninput="setFormField(\'note\', this.value)"></div>';

  html += '    <button class="primary-btn" id="saveTxBtn" ' + (canSave?'':'disabled') + ' onclick="saveTransaction()">' + (isEditing ? 'Guardar cambios' : 'Guardar movimiento') + '</button>';
  html += '  </div>';
  html += '</div>';

  var wrap = document.createElement('div');
  wrap.innerHTML = html;
  document.getElementById('app').appendChild(wrap.firstChild);
}
